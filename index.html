/* ====================== CIERRE DE CAJA ====================== */
let cierreFondoInicial = 0;
let cierreContado = null;
function vistaCierre(){
  if(!usuarioEsAdmin()){
    return `
    <div class="text-center py-20 text-gray-400">
      <div class="text-5xl mb-3">🔒</div>
      <div class="font-semibold text-gray-600">El cierre de caja es solo para el administrador.</div>
      <div class="text-sm mt-1">Pedile a un administrador que lo haga.</div>
    </div>`;
  }
  const hoy = inicioDeHoy();
  const eliminacionesHoy = state.eliminaciones.filter(e=>e.fecha>=hoy);
  const ventasHoy = state.ventas.filter(v=>v.fecha>=hoy);
  const efectivoVentas = ventasHoy.filter(v=>v.metodoPago==='efectivo').reduce((s,v)=>s+v.total,0);
  const transferenciaVentas = ventasHoy.filter(v=>v.metodoPago==='transferencia').reduce((s,v)=>s+v.total,0);
  const mercadoPagoVentas = ventasHoy.filter(v=>v.metodoPago==='mercadopago').reduce((s,v)=>s+v.total,0);
  const fiadoVentas = ventasHoy.filter(v=>v.metodoPago==='fiado').reduce((s,v)=>s+v.total,0);
  const pagosFiadoHoy = state.fiadoMovimientos.filter(m=>m.tipo==='pago' && m.fecha>=hoy).reduce((s,m)=>s+m.monto,0);
  const gastosEfectivoHoy = state.gastos.filter(g=>g.fecha>=hoy && g.metodoPago==='efectivo').reduce((s,g)=>s+g.monto,0);
  const efectivoEsperado = cierreFondoInicial + efectivoVentas + pagosFiadoHoy - gastosEfectivoHoy;
  const diferencia = cierreContado !== null ? cierreContado - efectivoEsperado : null;

  return `
  <div class="card p-4 mt-2 mb-4">
    <div class="section-label mb-2">Movimientos de hoy</div>
    <div class="flex flex-col gap-2">
      <div class="flex justify-between text-gray-700"><span>💵 Ventas en efectivo</span><span class="font-bold">${money(efectivoVentas)}</span></div>
      <div class="flex justify-between text-gray-700"><span>📲 Transferencias</span><span class="font-bold">${money(transferenciaVentas)}</span></div>
      ${mercadoPagoVentas ? `<div class="flex justify-between text-gray-700"><span>💳 MercadoPago</span><span class="font-bold">${money(mercadoPagoVentas)}</span></div>` : ''}

  const val = parseFloat(document.getElementById('cierre-contado').value);

function guardarCierre(){
  const hoy = inicioDeHoy();
  const ventasHoy = state.ventas.filter(v=>v.fecha>=hoy);
  const efectivoVentas = ventasHoy.filter(v=>v.metodoPago==='efectivo').reduce((s,v)=>s+v.total,0);
  const pagosFiadoHoy = state.fiadoMovimientos.filter(m=>m.tipo==='pago' && m.fecha>=hoy).reduce((s,m)=>s+m.monto,0);
  const gastosEfectivoHoy = state.gastos.filter(g=>g.fecha>=hoy && g.metodoPago==='efectivo').reduce((s,g)=>s+g.monto,0);
  const efectivoEsperado = cierreFondoInicial + efectivoVentas + pagosFiadoHoy - gastosEfectivoHoy;
  const diferencia = cierreContado - efectivoEsperado;
  state.cierres.push({ id: uid(), fecha: Date.now(), fondoInicial: cierreFondoInicial, esperado: efectivoEsperado, contado: cierreContado, diferencia });
  guardar();
  cierreContado = null;
  cierreFondoInicial = 0;
  renderApp();
  toast('Cierre guardado', {icon:'💾'});
}

/* ====================== RECEPCIÓN DE MERCADERÍA ======================
   El momento en que llega el camión del proveedor: cargar rápido lo que
   llegó, detectar si algún costo subió respecto de la última compra, y
   sugerir un nuevo precio de venta para no perder margen sin darse cuenta. */
let recepcionProveedorId = '';       // proveedor de la recepción en curso
let carritoRecepcion = {};           // productoId -> { cantidad, costoUnitario }
let recepcionFotoBoleta = '';        // dataURL comprimido de la foto del comprobante (opcional)
let recepcionFormaPago = 'efectivo'; // 'efectivo' | 'cuenta_corriente' | 'cheque'
let recepcionFechaCheque = '';
let recepcionActualizarPrecios = true;

function iniciarRecepcion(proveedorId){
  recepcionProveedorId = proveedorId;
  carritoRecepcion = {};
  recepcionFotoBoleta = '';
  recepcionFormaPago = 'efectivo';
  recepcionFechaCheque = '';
  recepcionActualizarPrecios = true;
  ir('#/recepcion');
}
function agregarRecepcionCarrito(productoId){
  const p = state.productos.find(x=>x.id===productoId);
  if(!p) return;
  if(!carritoRecepcion[productoId]){
    carritoRecepcion[productoId] = { cantidad: 1, costoUnitario: p.costo || 0 };
  } else {
    carritoRecepcion[productoId].cantidad += 1;
  }
  if(navigator.vibrate) navigator.vibrate(15);
  renderApp();
}
function quitarRecepcionCarrito(productoId){
  delete carritoRecepcion[productoId];
  renderApp();
}
function cambiarCantidadRecepcion(productoId, valor){
  const n = parseInt(valor) || 0;
  if(n <= 0){ delete carritoRecepcion[productoId]; } else { carritoRecepcion[productoId].cantidad = n; }
  renderApp();
}
function cambiarCostoRecepcion(productoId, valor){
  const n = parseFloat(valor);
  carritoRecepcion[productoId].costoUnitario = isNaN(n) ? 0 : n;
  renderApp();
}
function escanearParaRecepcion(){
  iniciarEscaneo((codigo) => {
    const p = state.productos.find(x=>x.codigoBarras && x.codigoBarras === codigo);
    if(p){
      if(!p.proveedorId){ p.proveedorId = recepcionProveedorId; guardar(); }
      agregarRecepcionCarrito(p.id);
      toast(`${p.nombre} agregado`, {icon:'📷'});
    } else {
      mostrarVincularCodigoBarras(codigo, (pElegido) => {
        if(!pElegido.proveedorId){ pElegido.proveedorId = recepcionProveedorId; guardar(); }
        agregarRecepcionCarrito(pElegido.id);
        toast(`${pElegido.nombre} agregado`, {icon:'📷'});
      });
    }
  });
}
// Mantiene el mismo % de margen que ya tenía el producto, aplicado al costo nuevo.
function calcularSugerenciaPrecio(producto, costoNuevo){
  if(!producto.costo || producto.costo <= 0 || !producto.precio) return null;
  const margen = producto.precio / producto.costo;
  return Math.round((costoNuevo * margen) / 10) * 10;
}
// Solo guardamos la foto como respaldo adjunto (no hay lectura automática de
// texto/OCR: eso necesitaría un servicio de IA con backend pago). Se
// comprime en el celular antes de guardar para no pasarnos del límite de
// tamaño de un documento en Firestore.
function adjuntarFotoBoleta(event){
  const file = event.target.files[0];
  if(!file) return;
  const lector = new FileReader();
  lector.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, 1000 / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * escala;
      canvas.height = img.height * escala;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      recepcionFotoBoleta = canvas.toDataURL('image/jpeg', 0.6);
      renderApp();
      toast('Foto adjuntada', {icon:'📎'});
    };
    img.src = e.target.result;
  };
  lector.readAsDataURL(file);
}
function quitarFotoBoleta(){
  recepcionFotoBoleta = '';
  renderApp();
}

function confirmarRecepcion(){
  const items = Object.entries(carritoRecepcion);
  if(!items.length){ toast('Agregá al menos un producto', {icon:'✍️'}); return; }
  const prov = state.proveedores.find(x=>x.id===recepcionProveedorId);
  if(!prov) return;
  const total = items.reduce((s,[,it]) => s + it.costoUnitario*it.cantidad, 0);
  const itemsGuardados = [];

  items.forEach(([id, it]) => {
    const p = state.productos.find(x=>x.id===id);
    if(!p) return;
    const costoAnterior = p.costo || 0;
    itemsGuardados.push({ productoId: id, nombre: p.nombre, cantidad: it.cantidad, costoUnitario: it.costoUnitario, costoAnterior });
    p.stock = (p.stock || 0) + it.cantidad;
    if(recepcionActualizarPrecios && it.costoUnitario > costoAnterior){
      const sugerido = calcularSugerenciaPrecio(p, it.costoUnitario);
      if(sugerido) p.precio = sugerido;
    }
    p.costo = it.costoUnitario;
  });

  state.recepciones.push({
    id: uid(),
    proveedorId: prov.id,
    proveedorNombre: prov.nombre,
    fecha: Date.now(),
    items: itemsGuardados,
    total,
    formaPago: recepcionFormaPago,
    fechaCheque: recepcionFormaPago==='cheque' ? recepcionFechaCheque : '',
    comprobanteFoto: recepcionFotoBoleta || ''
  });

  if(recepcionFormaPago === 'efectivo'){
    state.gastos.push({ id: uid(), categoria:'mercaderia', descripcion:`Compra a ${prov.nombre}`, monto: total, fecha: Date.now() });
  } else {
    prov.cuentaCorriente = (prov.cuentaCorriente || 0) + total;
    const detalle = recepcionFormaPago==='cheque' ? `Cheque${recepcionFechaCheque?' - vence '+formatearFechaCorta(recepcionFechaCheque):''}` : 'Compra en cuenta corriente';
    state.proveedorMovimientos.push({ id: uid(), proveedorId: prov.id, tipo:'debe', monto: total, fecha: Date.now(), detalle });
  }

  guardar();
  toast(`Recepción guardada: ${itemsGuardados.length} producto${itemsGuardados.length===1?'':'s'}, stock actualizado`, { icon:'✅', duracion:4500 });
  carritoRecepcion = {};
  recepcionFotoBoleta = '';
  ir('#/proveedores');
}
function registrarPagoProveedor(proveedorId){
  const prov = state.proveedores.find(x=>x.id===proveedorId);
  if(!prov) return;
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-1">Registrar pago a ${prov.nombre}</div>
      <div class="text-gray-500 text-sm mb-4">Le debés ${money(prov.cuentaCorriente||0)}</div>
      <input id="pp-monto" type="number" inputmode="decimal" placeholder="Monto pagado" value="${prov.cuentaCorriente||0}" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg mb-4" />

function confirmarPagoProveedor(proveedorId){
  const prov = state.proveedores.find(x=>x.id===proveedorId);

  if(monto <= 0){ toast('Poné un monto válido', {icon:'✍️'}); return; }
  prov.cuentaCorriente = Math.max(0, (prov.cuentaCorriente||0) - monto);
  state.proveedorMovimientos.push({ id: uid(), proveedorId, tipo:'pago', monto, fecha: Date.now(), detalle:'Pago registrado' });
  guardar();
  cerrarModal();
  renderApp();
  toast('Pago registrado', {icon:'✅'});
}

let filtroPeriodoReportes = 'mes';
function formatearCambio(actual, anterior){
  if(anterior <= 0){
    return actual > 0 ? { texto: 'primera vez con ventas', color: '#059669' } : { texto: 'sin datos del mes pasado', color: '#9ca3af' };
  }
  const pct = ((actual - anterior) / anterior) * 100;
  const signo = pct >= 0 ? '▲' : '▼';
  return { texto: `${signo} ${Math.abs(pct).toFixed(0)}%`, color: pct >= 0 ? '#059669' : '#dc2626' };
}
function calcularRanking(ventasFiltradas){
  const stats = {};
  ventasFiltradas.forEach(v => {
    v.items.forEach(it => {
      const p = state.productos.find(x=>x.id===it.productoId);
      const key = 'p:'+it.productoId;
      if(!stats[key]) stats[key] = { emoji: p?p.emoji:'❔', nombre: p?p.nombre:'(producto eliminado)', cantidad:0, ganancia:0 };
      stats[key].cantidad += it.cantidad;
      if(p) stats[key].ganancia += (p.precio - p.costo) * it.cantidad;
    });
    (v.combos||[]).forEach(cv => {
      const c = state.combos.find(x=>x.id===cv.comboId);
      const key = 'c:'+cv.comboId;
      if(!stats[key]) stats[key] = { emoji: c?c.emoji:'🎁', nombre: c?(c.nombre+' (combo)'):'(combo eliminado)', cantidad:0, ganancia:0 };
      stats[key].cantidad += cv.cantidad;
      if(c){
        let costoCombo = 0;
        c.itemIds.forEach(ci => { const p = state.productos.find(x=>x.id===ci.productoId); if(p) costoCombo += p.costo*ci.cantidad; });
        stats[key].ganancia += (c.precio - costoCombo) * cv.cantidad;
      }
    });
  });
  return Object.values(stats);
}

function ventasPeriodoActual(){
  const hoy = new Date();
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getTime();
  return filtroPeriodoReportes === 'mes' ? state.ventas.filter(v => v.fecha >= inicioMes) : state.ventas;
}
function descargarReporteCSV(){
  const ventas = [...ventasPeriodoActual()].sort((a,b)=>a.fecha-b.fecha);
  const filas = [['Fecha','Hora','Metodo de pago','Cantidad de productos','Total','Ganancia']];
  ventas.forEach(v => {
    const d = new Date(v.fecha);
    const cantidad = v.items.reduce((s,i)=>s+i.cantidad,0) + (v.combos||[]).reduce((s,i)=>s+i.cantidad,0);
    filas.push([d.toLocaleDateString('es-AR'), d.toLocaleTimeString('es-AR'), v.metodoPago, cantidad, v.total, v.ganancia]);
  });
  const csv = filas.map(f => f.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ventas-${state.negocio.nombre.replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('CSV descargado', { icon:'⬇️' });
}

function imprimirComprobante(id){
  const venta = state.ventas.find(v=>v.id===id);
  if(!venta) return;
  const items = venta.items.map(it => {
    const p = state.productos.find(x=>x.id===it.productoId);
    return { nombre: p ? p.nombre : '(producto eliminado)', cantidad: it.cantidad, precio: p ? p.precio : 0 };
  });
  const combos = (venta.combos||[]).map(cv => {
    const c = state.combos.find(x=>x.id===cv.comboId);
    return { nombre: c ? `${c.nombre} (combo)` : '(combo eliminado)', cantidad: cv.cantidad, precio: c ? c.precio : 0 };

  const todosLosItems = [...items, ...combos];
  const f = venta.facturaAfip;
  let qrImgTag = '';

    qr.addData(f.qrUrl);
    qr.make();
    qrImgTag = `<div style="text-align:center; margin-top:12px;"><img src="${qr.createDataURL(4,4)}" style="width:120px;height:120px;" /></div>`;

function dibujarGraficoReportes(){
  const ctx = document.getElementById('chart-reportes');
  if(!ctx) return;
  const dias = [], totales = [];
  if(filtroPeriodoReportes === 'mes'){
    const hoy = new Date();
    for(let dia=1; dia<=hoy.getDate(); dia++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), dia).getTime();
      const dSig = new Date(hoy.getFullYear(), hoy.getMonth(), dia+1).getTime();
      dias.push(String(dia));
      totales.push(state.ventas.filter(v => v.fecha >= d && v.fecha < dSig).reduce((s,v)=>s+v.ganancia,0));
    }
  } else {
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
      const dSig = d.getTime() + 24*3600*1000;
      dias.push(d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}));
      totales.push(state.ventas.filter(v => v.fecha >= d.getTime() && v.fecha < dSig).reduce((s,v)=>s+v.ganancia,0));
    }
  }
  new Chart(ctx, {
    type: 'line',
    data: { labels: dias, datasets: [{ data: totales, borderColor:'#4338ca', backgroundColor:'rgba(67,56,202,.1)', fill:true, tension:.3, pointRadius:2 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{display:false}, grid:{display:false}}, x:{grid:{display:false}} } }
  });
}

/* ---- Generador de certificado AFIP (todo en el navegador, con node-forge) ----
   Un dueño de almacén promedio no tiene por qué saber instalar OpenSSL ni
   correr comandos — esto genera la clave privada y el pedido de
   certificado (CSR) acá mismo, con el mismo formato exacto que exige AFIP
   (serialNumber = "CUIT nnnnnnnnnnn", verificado contra los manuales
   oficiales y cruzado con OpenSSL). La clave nunca sale del navegador
   hasta que el propio dueño decida guardar la configuración. */
function mostrarGenerarCertificadoAfip(){
  const cuit = document.getElementById('cfg-afip-cuit').value.trim();
  if(!/^\d{11}$/.test(cuit)){
    toast('Primero escribí tu CUIT arriba (11 números, sin guiones ni espacios)', {icon:'✍️', duracion:4500});
    return;
  }
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-3">Generar certificado</div>
      <div class="text-gray-500 text-sm mb-4">Vamos a crear tu clave y el pedido de certificado (CSR) acá mismo, en tu celular o compu — nunca sale de acá hasta que vos guardes la configuración. Después hay que pegarlo en el sitio de AFIP para que te den el certificado final (es gratis).</div>
      <button onclick="generarClaveYCsrAfip('${cuit}')" class="tap w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl text-lg mb-2">Generar ahora</button>
      <button onclick="cerrarModal()" class="tap w-full text-gray-400 font-semibold py-2">Cancelar</button>
    </div>
  `);
}
function generarClaveYCsrAfip(cuit){
  abrirModal(`
    <div class="p-5 text-center py-16">
      ${icono('loader-circle','w-8 h-8 animate-spin mx-auto text-gray-300')}
      <div class="text-gray-400 mt-3">Generando (puede tardar unos segundos)...</div>
    </div>
  `);
  refrescarIconos();
  // setTimeout para que el navegador alcance a pintar el "Generando..." antes
  // de bloquearse un rato con la cuenta pesada de generar la clave RSA.
  setTimeout(() => {
    try{
      const alias = ('MercadoApp-' + (state.negocio.nombre||'Negocio')).replace(/[^a-zA-Z0-9-]/g,'').slice(0,40);
      const keys = forge.pki.rsa.generateKeyPair(2048);
      const csr = forge.pki.createCertificationRequest();
      csr.publicKey = keys.publicKey;
      csr.setSubject([
        { shortName: 'C', value: 'AR' },
        { shortName: 'O', value: 'MercadoApp' },
        { shortName: 'CN', value: alias },
        { type: '2.5.4.5', value: `CUIT ${cuit}` } // serialNumber — formato exacto que pide AFIP
      ]);
      csr.sign(keys.privateKey, forge.md.sha256.create());
      const csrPem = forge.pki.certificationRequestToPem(csr);
      const keyPem = forge.pki.privateKeyToPem(keys.privateKey);
      const campoClave = document.getElementById('cfg-afip-key');
      if(campoClave) campoClave.value = keyPem; // la pantalla de atrás sigue viva, solo se tapó con el modal
      mostrarPasosAfipConCsr(csrPem);
    }catch(e){
      toast('No se pudo generar. Probá de nuevo.', {icon:'⚠️', duracion:4000});
      cerrarModal();
    }
  }, 50);
}
function mostrarPasosAfipConCsr(csrPem){
  window.__csrGeneradoAfip = csrPem;
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-1">✅ Ya generamos tu clave</div>
      <div class="text-gray-500 text-sm mb-4">Quedó en el campo "Clave privada" de la pantalla de atrás (todavía no se guardó en ningún lado hasta que apretés "Guardar" ahí). Ahora hace falta que completes esto en AFIP:</div>
      <div class="bg-gray-50 rounded-2xl p-3 mb-3 text-sm text-gray-700 flex flex-col gap-2">
        <div><b>1.</b> Entrá a <a href="https://www.afip.gob.ar" target="_blank" class="text-indigo-700 underline">afip.gob.ar</a> con tu Clave Fiscal</div>
        <div><b>2.</b> Si es la primera vez: "Administrador de Relaciones de Clave Fiscal" → "Adherir servicio" → "Servicios interactivos" → buscá y adherí <b>WSASS</b></div>
        <div><b>3.</b> Entrá a <b>WSASS</b> → "Nuevo Certificado"</div>
        <div><b>4.</b> Pegá el texto de abajo en el campo del pedido de certificado (CSR)</div>
        <div><b>5.</b> Copiá TODO el certificado que te devuelve AFIP (arranca con "-----BEGIN CERTIFICATE-----") y pegalo en el campo "Certificado" de la pantalla de atrás</div>
        <div><b>6.</b> En WSASS, andá a "Crear Autorización a Servicio": elegí el certificado recién creado, como CUIT representado poné tu mismo CUIT, y como servicio elegí <b>wsfe</b></div>
      </div>
      <label class="font-semibold text-gray-600 text-sm">Tu pedido de certificado (CSR) — copialo y pegalo en AFIP</label>
      <textarea readonly rows="6" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-xs my-2 mb-3" style="font-family:monospace;">${csrPem}</textarea>
      <button onclick="copiarCsrAfip()" class="tap w-full bg-white border-2 border-gray-200 text-gray-700 font-bold py-3 rounded-2xl mb-2">📋 Copiar CSR</button>
      <button onclick="cerrarModal()" class="tap w-full bg-indigo-700 text-white font-bold py-3.5 rounded-2xl">Listo, ya lo copié</button>
    </div>
  `);
}
function copiarCsrAfip(){
  navigator.clipboard.writeText(window.__csrGeneradoAfip || '')
    .then(() => toast('CSR copiado', {icon:'📋'}))
    .catch(() => toast('No se pudo copiar. Copialo a mano del cuadro de texto.', {icon:'⚠️'}));
}

async function enviarComprobantePorEmail(ventaId){
  const venta = state.ventas.find(v=>v.id===ventaId);
  if(!venta) return;
  const cfg = state.negocio.emailjs;
  if(!cfg || !cfg.serviceId){ toast('Todavía no configuraste el email en Configuración', {icon:'⚠️', duracion:4000}); return; }
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-4">Enviar comprobante</div>
      <label class="font-semibold text-gray-600">Email del cliente</label>
      <input id="email-destino" type="email" placeholder="cliente@ejemplo.com" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg my-2 mb-4" />
      <button onclick="confirmarEnvioEmail('${ventaId}')" class="tap w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl text-lg">Enviar</button>
    </div>
  `);
}
async function confirmarEnvioEmail(ventaId){
  const venta = state.ventas.find(v=>v.id===ventaId);
  const email = document.getElementById('email-destino').value.trim();
  if(!email || !email.includes('@')){ toast('Escribí un email válido', {icon:'✍️'}); return; }
  const cfg = state.negocio.emailjs;
  const items = venta.items.map(it => {
    const p = state.productos.find(x=>x.id===it.productoId);
    return `${it.cantidad}x ${p?p.nombre:'(producto eliminado)'}`;
  });
  const combos = (venta.combos||[]).map(cv => {
    const c = state.combos.find(x=>x.id===cv.comboId);
    return `${cv.cantidad}x ${c?c.nombre+' (combo)':'(combo eliminado)'}`;
  });
  abrirModal(`<div class="p-5 text-center py-16">${icono('loader-circle','w-8 h-8 animate-spin mx-auto text-gray-300')}<div class="text-gray-400 mt-3">Enviando...</div></div>`);
  refrescarIconos();
  try{
    const resp = await conTimeout(fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: cfg.serviceId,
        template_id: cfg.templateId,
        user_id: cfg.publicKey,
        template_params: {
          to_email: email,
          negocio_nombre: state.negocio.nombre,
          fecha: fechaHora(venta.fecha),
          items: [...items, ...combos].join('\n'),
          total: money(venta.total)
        }
      })
    }), 15000);
    if(!resp.ok){ const texto = await resp.text(); throw new Error(texto); }
    cerrarModal();
    toast('¡Comprobante enviado!', {icon:'✅'});
  }catch(e){
    cerrarModal();
    toast('No se pudo enviar: ' + ((e&&e.message)||''), {icon:'⚠️', duracion:6000});
  }
}
function dataUrlQrCatalogo(){
  if(typeof qrcode === 'undefined') return '';
  const qr = qrcode(0, 'M'); // 0 = detecta el tamaño solo según el largo del link
  qr.addData(urlCatalogoPublico());
  qr.make();
  return qr.createDataURL(6, 8);
}
function copiarLinkCatalogo(){
  navigator.clipboard.writeText(urlCatalogoPublico())
    .then(() => toast('Link copiado', {icon:'📋'}))
    .catch(() => toast('No se pudo copiar. Copialo a mano.', {icon:'⚠️'}));
}
function descargarQrCatalogo(){
  const a = document.createElement('a');
  a.href = dataUrlQrCatalogo();
  a.download = `qr-catalogo-${(state.negocio.nombre||'negocio').toLowerCase().replace(/\s+/g,'-')}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function guardarUsuario(id){
  const nombre = document.getElementById('uf-nombre').value.trim();
  const rol = document.getElementById('uf-rol').value;
  const pin = document.getElementById('uf-pin').value.trim();
  if(!nombre){ toast('Escribí el nombre', {icon:'✍️'}); return; }
  if(id){
    if(pin && !/^\d{4}$/.test(pin)){ toast('El PIN tiene que ser de 4 números', {icon:'🔢'}); return; }
    const u = state.usuarios.find(x=>x.id===id);
    Object.assign(u, { nombre, rol }, pin ? { pin } : {});
  } else {
    if(!/^\d{4}$/.test(pin)){ toast('El PIN tiene que ser de 4 números', {icon:'🔢'}); return; }
    state.usuarios.push({ id: uid(), nombre, rol, pin });
  }
  guardar();
  cerrarModal();
  renderApp();
  toast('Usuario guardado', {icon:'✅'});

let pinIngresado = '';
function mostrarIngresoPIN(usuarioId){
  pinIngresado = '';
  const u = state.usuarios.find(x=>x.id===usuarioId);
  abrirModal(`
    <div class="p-5 text-center">
      <div class="text-xl font-extrabold text-gray-900 mb-1">Hola, ${u.nombre}</div>

      <div class="grid grid-cols-3 gap-3">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="tocarPIN('${usuarioId}',${n})" class="tap card py-4 text-2xl font-bold">${n}</button>`).join('')}
        <div></div>
        <button onclick="tocarPIN('${usuarioId}',0)" class="tap card py-4 text-2xl font-bold">0</button>
        <button onclick="borrarPIN()" class="tap card py-4 text-xl font-bold">⌫</button>
      </div>
    </div>
  `);

function tocarPIN(usuarioId, digito){
  if(pinIngresado.length >= 4) return;
  pinIngresado += digito;
  const el = document.getElementById('pin-puntos');
  if(el) el.textContent = pinIngresado.split('').map(()=>'●').join(' ') + (pinIngresado.length<4 ? ' ' + Array(4-pinIngresado.length).fill('○').join(' ') : '');
  if(pinIngresado.length === 4){
    const u = state.usuarios.find(x=>x.id===usuarioId);
    if(u.pin === pinIngresado){
      state.usuarioActualId = usuarioId;
      guardar();
      cerrarModal();
      renderApp();
      toast(`¡Hola, ${u.nombre}!`, {icon:'👋'});
    } else {
      toast('PIN incorrecto', {icon:'⚠️'});
      pinIngresado = '';
      if(el) el.textContent = '○ ○ ○ ○';
    }
  }
}
function borrarPIN(){
  pinIngresado = pinIngresado.slice(0,-1);
  const el = document.getElementById('pin-puntos');
  if(el) el.textContent = pinIngresado.split('').map(()=>'●').join(' ') + (pinIngresado.length<4 ? ' ' + Array(4-pinIngresado.length).fill('○').join(' ') : '');
}

function descargarBackup(){
  const datos = JSON.stringify(state, null, 2);
  const blob = new Blob([datos], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const nombreArchivo = `backup-${state.negocio.nombre.replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Copia de seguridad descargada', {icon:'⬇️'});
}
function restaurarBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const datos = JSON.parse(e.target.result);
      if(!datos.negocio){ toast('Ese archivo no parece una copia de seguridad válida', {icon:'⚠️'}); return; }
      confirmarAccion('¿Restaurar esta copia? Se van a reemplazar todos los datos actuales por los del archivo.', () => {
        state = { ...estadoVacio(), ...datos };
        migrarProductos();
        guardar();
        aplicarTamanoLetra();
        ir('#/inicio');
        renderApp();
        toast('Copia restaurada correctamente', {icon:'✅'});
      }, 'Sí, restaurar');
    }catch(err){
      toast('No se pudo leer ese archivo', {icon:'⚠️'});
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

}

/* ====================== CATÁLOGO PÚBLICO (?tienda=uid) ======================
   Página completamente aparte de la app: sin login, la abre cualquier
   cliente escaneando el QR del negocio. Solo lee "catalogosPublicos/{uid}"
   (el espejo público, nunca el negocio real) y solo escribe pedidos nuevos
   en "pedidosPublicos" — jamás toca los datos privados del comercio. */
let catalogoPublicoUid = '';
let catalogoPublicoDatos = null;
let carritoPublico = [];       // [{productoId, cantidad}]
let busquedaPublico = '';
let categoriaPublico = '';

async function arrancarCatalogoPublico(uidNegocio){
  catalogoPublicoUid = uidNegocio;
  document.getElementById('app').innerHTML = `<div class="flex items-center justify-center py-24 text-gray-300">${icono('loader-circle','w-8 h-8 animate-spin')}</div>`;
  refrescarIconos();
  try{
    catalogoPublicoDatos = await conTimeout(window.fbCargarCatalogoPublico(uidNegocio), 10000);
  }catch(e){
    catalogoPublicoDatos = null;
  }
  if(!catalogoPublicoDatos){
    document.getElementById('app').innerHTML = `
      <div class="flex flex-col items-center justify-center text-center py-24 px-6">
        <div class="text-5xl mb-3">🔍</div>
        <div class="text-xl font-bold text-gray-800 mb-1">No encontramos este catálogo</div>
        <div class="text-gray-400">El link puede estar mal escrito, o el negocio todavía no lo activó.</div>
      </div>`;
    return;
  }
  document.title = catalogoPublicoDatos.nombre + ' · Catálogo';
  const metaRobots = document.createElement('meta');
  metaRobots.name = 'robots';
  metaRobots.content = catalogoPublicoDatos.indexable ? 'index, follow' : 'noindex, nofollow';
  document.head.appendChild(metaRobots);
  renderCatalogoPublico();
}

function renderCatalogoPublico(){
  const app = document.getElementById('app');
  const activo = document.activeElement;
  const idActivo = (activo && app.contains(activo) && activo.id) ? activo.id : null;
  const selStart = idActivo && 'selectionStart' in activo ? activo.selectionStart : null;
  const d = catalogoPublicoDatos;
  const categoriasConProductos = d.categorias.filter(c => d.productos.some(p => p.categoriaId === c.id));
  const q = normalizarTexto(busquedaPublico);
  let productos = d.productos;
  if(categoriaPublico) productos = productos.filter(p => p.categoriaId === categoriaPublico);
  if(q) productos = productos.filter(p => normalizarTexto(p.nombre).includes(q) || normalizarTexto(p.marca||'').includes(q));
  const cantCarrito = carritoPublico.reduce((s,it)=>s+it.cantidad,0);
  const totalCarrito = carritoPublico.reduce((s,it) => {
    const p = d.productos.find(x=>x.id===it.productoId);
    return s + (p ? p.precio*it.cantidad : 0);
  }, 0);

  app.innerHTML = `
    ${d.portadaUrl ? `<div class="w-full h-32 bg-gray-100 bg-cover bg-center" style="background-image:url('${d.portadaUrl}')"></div>` : ''}
    <div class="px-4 ${d.portadaUrl ? '-mt-8' : 'pt-5'} pb-3 flex items-end gap-3">
      ${d.logoUrl
        ? `<img src="${d.logoUrl}" class="w-16 h-16 rounded-2xl object-cover border-4 border-white shadow bg-white" />`
        : `<div class="w-16 h-16 rounded-2xl bg-indigo-700 text-white flex items-center justify-center text-2xl font-extrabold border-4 border-white shadow flex-shrink-0">${(d.nombre||'?').charAt(0).toUpperCase()}</div>`}
      <div class="pb-1 min-w-0">
        <div class="text-xl font-extrabold text-gray-900 leading-tight truncate">${d.nombre}</div>
        <div class="text-gray-400 text-sm">Catálogo digital</div>
      </div>
    </div>
    <div class="px-4">
      <input id="cat-pub-buscar" value="${busquedaPublico}" oninput="filtrarCatalogoPublico(this.value)" placeholder="Buscar producto..." class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg mb-3" />
      ${categoriasConProductos.length ? `
      <div class="flex gap-2 overflow-x-auto pb-3 mb-1">
        <button onclick="filtrarCategoriaPublico('')" class="tap flex-shrink-0 px-4 py-2 rounded-full font-bold text-sm ${!categoriaPublico?'bg-indigo-700 text-white':'bg-gray-100 text-gray-600'}">Todo</button>
        ${categoriasConProductos.map(c => `<button onclick="filtrarCategoriaPublico('${c.id}')" class="tap flex-shrink-0 px-4 py-2 rounded-full font-bold text-sm ${categoriaPublico===c.id?'bg-indigo-700 text-white':'bg-gray-100 text-gray-600'}">${c.emoji||''} ${c.nombre}</button>`).join('')}
      </div>` : ''}
    </div>
    <div class="px-4 grid grid-cols-2 gap-3 pb-28">
      ${productos.length ? productos.map(p => `
        <div class="card p-3 flex flex-col">
          <div class="flex justify-center mb-2">${iconoProducto(p,'w-16 h-16','text-5xl')}</div>
          <div class="font-bold text-gray-800 text-sm leading-tight mb-1" style="min-height:2.5em;">${p.nombre}</div>
          <div class="text-indigo-700 font-extrabold mb-2">${money(p.precio)}</div>
          ${p.disponible
            ? `<button onclick="agregarAlCarritoPublico('${p.id}')" class="tap w-full bg-indigo-700 text-white font-bold py-2 rounded-xl text-sm">+ Agregar</button>`
            : `<div class="w-full text-center text-gray-300 font-bold py-2 text-sm">Sin stock</div>`}
        </div>
      `).join('') : `<div class="col-span-2 text-center py-16 text-gray-400">No encontramos productos</div>`}
    </div>
    ${cantCarrito ? `
    <button onclick="mostrarCarritoPublico()" class="tap fixed bottom-4 left-4 right-4 max-w-lg mx-auto bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-between px-6 z-30">
      <span>🛒 ${cantCarrito} producto${cantCarrito===1?'':'s'}</span>
      <span>${money(totalCarrito)}</span>
    </button>` : ''}
  `;
  refrescarIconos();
  if(idActivo){
    const el = document.getElementById(idActivo);
    if(el){ el.focus(); if(selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }
}
function filtrarCatalogoPublico(v){ busquedaPublico = v; renderCatalogoPublico(); }
function filtrarCategoriaPublico(id){ categoriaPublico = id; renderCatalogoPublico(); }
function agregarAlCarritoPublico(productoId){
  const it = carritoPublico.find(x=>x.productoId===productoId);
  if(it) it.cantidad++; else carritoPublico.push({ productoId, cantidad: 1 });
  renderCatalogoPublico();
  const estaEnCarrito = document.getElementById('modal-wrap').style.display === 'block';
  if(estaEnCarrito) mostrarCarritoPublico();
  else toast('Agregado al carrito', { icon:'🛒', duracion:1500 });
}
function quitarDelCarritoPublico(productoId){
  const it = carritoPublico.find(x=>x.productoId===productoId);
  if(!it) return;
  it.cantidad--;
  if(it.cantidad<=0) carritoPublico = carritoPublico.filter(x=>x.productoId!==productoId);
  renderCatalogoPublico();
  mostrarCarritoPublico();
}
function mostrarCarritoPublico(){
  const d = catalogoPublicoDatos;
  const items = carritoPublico.map(it => ({ ...it, p: d.productos.find(x=>x.id===it.productoId) })).filter(x=>x.p);
  const total = items.reduce((s,x)=>s+x.p.precio*x.cantidad, 0);
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-4">Tu pedido</div>
      <div class="flex flex-col gap-3 mb-4 max-h-64 overflow-y-auto">
        ${items.length ? items.map(x => `
          <div class="flex items-center justify-between gap-2">
            <div class="flex-1 min-w-0">
              <div class="font-bold text-gray-800 text-sm truncate">${x.p.nombre}</div>
              <div class="text-gray-400 text-xs">${money(x.p.precio)} c/u</div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="quitarDelCarritoPublico('${x.p.id}')" class="tap w-8 h-8 rounded-full bg-gray-100 font-bold">-</button>
              <span class="font-bold w-5 text-center">${x.cantidad}</span>
              <button onclick="agregarAlCarritoPublico('${x.p.id}')" class="tap w-8 h-8 rounded-full bg-gray-100 font-bold">+</button>
            </div>
          </div>
        `).join('') : `<div class="text-gray-400 text-center py-6">Carrito vacío</div>`}
      </div>
      ${items.length ? `
      <div class="flex justify-between font-extrabold text-lg mb-4 pt-3 border-t border-gray-100">
        <span>Total</span><span>${money(total)}</span>
      </div>
      <label class="font-semibold text-gray-600 text-sm">Tu nombre</label>
      <input id="pub-nombre" placeholder="Nombre" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg my-2 mb-2" />
      <label class="font-semibold text-gray-600 text-sm">Tu WhatsApp</label>
      <input id="pub-telefono" placeholder="Ej: 1122334455" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg my-2 mb-4" />
      <button onclick="enviarPedidoPublicoWhatsApp()" class="tap w-full bg-green-600 text-white font-bold py-4 rounded-2xl text-lg mb-2">💬 Pedir por WhatsApp</button>
      <button onclick="enviarPedidoPublicoWeb()" class="tap w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl text-lg mb-2">Enviar pedido</button>
      ` : ''}
      <button onclick="cerrarModal()" class="tap w-full text-gray-400 font-semibold py-2">Seguir viendo</button>
    </div>
  `);
}
function textoPedidoPublico(items, total){
  let txt = 'Hola! Quiero hacer un pedido:\n\n';
  items.forEach(x => { txt += `• ${x.cantidad} x ${x.p.nombre} — ${money(x.p.precio*x.cantidad)}\n`; });
  txt += `\nTotal: ${money(total)}`;
  return txt;
}
function enviarPedidoPublicoWhatsApp(){
  const d = catalogoPublicoDatos;
  const items = carritoPublico.map(it => ({ ...it, p: d.productos.find(x=>x.id===it.productoId) })).filter(x=>x.p);
  if(!items.length) return;
  if(!d.telefono){ toast('Este negocio todavía no cargó su WhatsApp', { icon:'📵' }); return; }
  const total = items.reduce((s,x)=>s+x.p.precio*x.cantidad, 0);
  const nombre = (document.getElementById('pub-nombre')?.value || '').trim();
  let txt = textoPedidoPublico(items, total);
  if(nombre) txt = `Soy ${nombre}. ` + txt;
  window.open(`https://wa.me/${limpiarTelefono(d.telefono)}?text=${encodeURIComponent(txt)}`, '_blank');
}
async function enviarPedidoPublicoWeb(){
  const d = catalogoPublicoDatos;
  const items = carritoPublico.map(it => ({ ...it, p: d.productos.find(x=>x.id===it.productoId) })).filter(x=>x.p);
  if(!items.length) return;
  const nombre = (document.getElementById('pub-nombre')?.value || '').trim();
  const telefono = (document.getElementById('pub-telefono')?.value || '').trim();
  if(!telefono){ toast('Dejanos tu WhatsApp para poder avisarte', { icon:'📵' }); return; }
  const total = items.reduce((s,x)=>s+x.p.precio*x.cantidad, 0);
  try{
    await window.fbCrearPedidoPublico({
      negocioUid: catalogoPublicoUid,
      clienteNombre: nombre,
      clienteTelefono: telefono,
      items: items.map(x => ({ productoId: x.p.id, nombre: x.p.nombre, cantidad: x.cantidad, precio: x.p.precio })),
      total,
      estado: 'nuevo',
      fecha: Date.now()
    });
    carritoPublico = [];
    cerrarModal();
    renderCatalogoPublico();
    toast('¡Pedido enviado! Te van a contactar por WhatsApp para confirmar.', { icon:'✅', duracion:5000 });
  }catch(e){
    toast('No se pudo enviar el pedido. Probá pedirlo por WhatsApp.', { icon:'⚠️', duracion:4000 });
  }
}
