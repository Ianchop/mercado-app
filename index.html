<script type="module">
  // Firebase: cuentas reales (email/contraseña + Google) y datos en la nube.
  // Se importa como módulo ES directo desde el CDN de Google: cero instalación,
  // sigue siendo un solo archivo HTML. Las funciones se cuelgan de "window"
  // para que el resto de la app (que es JS clásico) las pueda usar normal.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithRedirect, getRedirectResult, signInWithPopup, signOut, sendPasswordResetEmail,
    EmailAuthProvider, linkWithCredential
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAR3EfaWSJ5vQp2OjjTPa3RKMruLD9EGcs",
    authDomain: "mercado-appp.firebaseapp.com",
    projectId: "mercado-appp",
    storageBucket: "mercado-appp.firebasestorage.app",
    messagingSenderId: "702858318110",
    appId: "1:702858318110:web:5c4af57441ef9b5815f90f"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);
  try { await enableIndexedDbPersistence(fbDb); } catch(e) { /* varias pestañas abiertas u navegador viejo: seguimos solo-online */ }

  window.fbOnCambioAuth = (callback) => onAuthStateChanged(fbAuth, callback);
  window.fbRegistrarse = (email, password) => createUserWithEmailAndPassword(fbAuth, email, password);
  window.fbIniciarSesion = (email, password) => signInWithEmailAndPassword(fbAuth, email, password);
  // Primero probamos con ventana emergente (popup): no sale de la página, así
  // que evita el "ir y volver" por la página intermedia de Firebase que en
  // varios navegadores queda en blanco por los bloqueos de cookies de
  // terceros. Solo si el navegador bloquea el popup (típico en algunos
  // celulares) caemos a signInWithRedirect como respaldo.
  window.fbIniciarSesionGoogle = async () => {
    const provider = new GoogleAuthProvider();
    try{
      await signInWithPopup(fbAuth, provider);
    }catch(err){
      if(err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment'){
        return signInWithRedirect(fbAuth, provider);
      }
      throw err;
    }
  };
  window.fbResetPassword = (email) => sendPasswordResetEmail(fbAuth, email);
  window.fbCerrarSesion = () => signOut(fbAuth);
  window.fbGuardarNegocio = (uid, datos) => setDoc(doc(fbDb, 'negocios', uid), datos);
  window.fbCargarNegocio = async (uid) => {
    const snap = await getDoc(doc(fbDb, 'negocios', uid));
    return snap.exists() ? snap.data() : null;
  };

  // Suscripción mensual: se guarda separada del negocio para que el admin
  // pueda ver/gestionar el estado de pago de todos sin tocar los datos
  // de venta/stock/clientes de cada comercio (eso queda solo para el dueño).
  window.fbCrearSuscripcion = (uid, datos) => setDoc(doc(fbDb, 'suscripciones', uid), datos);
  window.fbCargarSuscripcion = async (uid) => {
    const snap = await getDoc(doc(fbDb, 'suscripciones', uid));
    return snap.exists() ? snap.data() : null;
  };
  window.fbListarSuscripciones = async () => {
    const snap = await getDocs(collection(fbDb, 'suscripciones'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };
  window.fbMarcarPagado = (uid, datos) => updateDoc(doc(fbDb, 'suscripciones', uid), datos);
  window.fbCargarConfigPagos = async () => {
    const snap = await getDoc(doc(fbDb, 'config', 'pagos'));
    return snap.exists() ? snap.data() : { linkMercadoPago: '' };
  };
  window.fbGuardarConfigPagos = (datos) => setDoc(doc(fbDb, 'config', 'pagos'), datos);

  // Cuentas creadas por Google: además del login de Google, exigimos una
  // contraseña propia (linkWithCredential la agrega a la MISMA cuenta, no
  // crea una cuenta nueva). Así el mail siempre tiene los dos métodos y
  // nunca se pisan entre sí.
  window.fbVincularPassword = (password) => {
    const cred = EmailAuthProvider.credential(fbAuth.currentUser.email, password);
    return linkWithCredential(fbAuth.currentUser, cred);
  };
  // Si alguien ya tenía cuenta por mail/contraseña y después toca "Continuar
  // con Google" con ese mismo mail, Firebase no los une solo (por seguridad):
  // hay que confirmar la contraseña existente y recién ahí vincular Google.
  window.fbCredencialGoogleDeError = (err) => GoogleAuthProvider.credentialFromError(err);
  window.fbIniciarSesionYVincularGoogle = async (email, password) => {
    await signInWithEmailAndPassword(fbAuth, email, password);
    const cred = window.__credencialGooglePendiente;
    if(cred){
      await linkWithCredential(fbAuth.currentUser, cred);
      window.__credencialGooglePendiente = null;
    }
  };

  // Al volver de la pantalla de Google, Firebase resuelve esto solo; acá
  // solo capturamos el error si algo salió mal (ej: dominio no autorizado,
  // o el mail ya tenía cuenta con contraseña) para poder avisarle al
  // usuario en vez de fallar en silencio.
  getRedirectResult(fbAuth).catch((err) => {
    window.__errorRedirectGoogle = err;
  });
</script>

<script>
// Guarda el último error global (aunque venga de un script de otro origen,
// como el de Firebase, con lo que el navegador nos deje ver) para poder
// mostrar una pista real si la sesión se cuelga, en vez de solo "algo falló".
window.__ultimoErrorGlobal = '';
window.addEventListener('error', (e) => {
  window.__ultimoErrorGlobal = (e.message || 'Error desconocido') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
});
window.addEventListener('unhandledrejection', (e) => {
  window.__ultimoErrorGlobal = 'Promesa rechazada: ' + ((e.reason && (e.reason.code || e.reason.message)) || String(e.reason));
});

/* ====================== CUENTAS (Firebase Auth) ====================== */
// Cada negocio = una cuenta real de Firebase (mail o Google), con sus datos
// guardados en la nube (Firestore), separados del resto por su propio uid.
function nombreRubro(tipo){
  return { mercado:'Mercado / Despensa', ropa:'Tienda de ropa', bazar:'Bazar / Regalería', otro:'Otro rubro' }[tipo] || 'Otro rubro';
}
function traducirErrorFirebase(err){
  const codigo = (err && err.code) || '';
  const mapa = {
    'auth/invalid-email': 'Ese mail no es válido',
    'auth/user-not-found': 'No encontramos ninguna cuenta con ese mail',
    'auth/wrong-password': 'La contraseña es incorrecta',
    'auth/invalid-credential': 'Mail o contraseña incorrectos',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese mail',
    'auth/weak-password': 'La contraseña tiene que tener al menos 6 caracteres',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar',
    'auth/network-request-failed': 'Revisá tu conexión a internet',
    'auth/unauthorized-domain': 'Este sitio todavía no está autorizado en Firebase',
    'auth/account-exists-with-different-credential': 'Ese mail ya tiene una cuenta creada con contraseña. Usá "¿Olvidaste tu contraseña?" para entrar.',
  };
  return mapa[codigo] || 'Ocurrió un error, probá de nuevo';
}

/* ====================== ESTADO Y PERSISTENCIA ====================== */
function estadoVacio(){
  return {
    negocio: null, // {nombre, tipo}
    productos: [],
    categorias: [],
    combos: [],
    proveedores: [],
    clientes: [],
    ventas: [],
    fiadoMovimientos: [],
    cierres: [],
    eliminaciones: [],
    gastos: [],
    usuarios: [],
    usuarioActualId: '',
    metaDiaria: 0,
    tamanoLetra: 'normal'
  };
}

let state = estadoVacio();
let usuarioFirebase = null; // usuario de Firebase logueado (o null)
let sesionLista = false; // true recién cuando Firebase nos confirmó si hay sesión o no

/* ====================== SUSCRIPCIÓN ($5.000/mes por Mercado Pago) ======================
   Este mail es solo para decidir QUÉ PANTALLA mostrar en el cliente (comodidad de UI).
   La seguridad de verdad está en las reglas de Firestore, que chequean el mismo mail
   del lado del servidor: aunque alguien edite este archivo, no puede leer ni tocar
   la suscripción de otro negocio ni marcarse a sí mismo como pagado. */
const ADMIN_EMAIL = 'psocikian@gmail.com';
function esAdminActual(){ return !!(usuarioFirebase && usuarioFirebase.email === ADMIN_EMAIL); }

let suscripcionActual = null; // suscripción del negocio logueado (dueños)
let listaSuscripciones = [];  // todas las suscripciones (solo panel admin)
let configPagos = { linkMercadoPago: '' };

/* ====================== CONTRASEÑA OBLIGATORIA PARA CUENTAS DE GOOGLE ======================
   Toda cuenta tiene que poder entrar también con mail+contraseña (no solo con
   Google), para no depender de un solo método. Estos dos flags gatean la
   pantalla correspondiente ANTES que cualquier otra cosa (admin, onboarding, etc). */
let pantallaCrearPassword = false; // true: logueado con Google pero sin contraseña propia todavía
let vinculandoGoogleEmail = '';    // no vacío: el mail ya tenía cuenta con contraseña, hay que confirmarla para unir Google
let errorCargaDatos = false;       // true: no se pudieron cargar los datos del negocio (conexión lenta/caída) — no seguir a onboarding para no pisar datos reales
let modoDemoAdmin = false;         // true: el admin está viendo la app normal (su propio negocio de demo) en vez del panel

function suscripcionValida(s){
  if(!s || !s.proximoVencimiento) return false;
  return s.proximoVencimiento >= new Date().toISOString().slice(0,10);
}
function calcularProximoVencimiento(){
  const d = new Date();
  d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0,10);
}
function estadoSuscripcionInfo(s){
  const hoy = new Date().toISOString().slice(0,10);
  if(!s || !s.proximoVencimiento) return { texto: 'Nunca pagó', bg:'#fef2f2', color:'#dc2626' };
  if(s.proximoVencimiento < hoy) return { texto: `Vencido (${formatearFechaCorta(s.proximoVencimiento)})`, bg:'#fef2f2', color:'#dc2626' };
  return { texto: `Activo hasta ${formatearFechaCorta(s.proximoVencimiento)}`, bg:'#ecfdf5', color:'#059669' };
}

function migrarProductos(){
  state.productos.forEach(p => {
    if(p.marca === undefined) p.marca = '';
    if(p.contenidoCantidad === undefined) p.contenidoCantidad = 1;
    if(p.contenidoUnidad === undefined) p.contenidoUnidad = 'unidades';
    if(p.vencimiento === undefined) p.vencimiento = '';
    if(p.temporada === undefined) p.temporada = '';
    if(p.categoriaId === undefined) p.categoriaId = '';
    if(p.proveedorId === undefined) p.proveedorId = '';
    if(p.codigoBarras === undefined) p.codigoBarras = '';
  });
}

let guardarTimeout = null;
function guardar(){
  if(!usuarioFirebase) return;
  clearTimeout(guardarTimeout);
  guardarTimeout = setTimeout(() => {
    window.fbGuardarNegocio(usuarioFirebase.uid, state).catch(() => {
      toast('No se pudo guardar en la nube. Revisá tu conexión.', { icon:'⚠️', duracion:4000 });
    });
  }, 400);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Con conexión lenta o inestable (muy común en el celular de un comercio de
// barrio), una consulta a Firestore puede quedar esperando sin resolver
// nunca. Sin este límite, la app se queda trabada en "Cargando..." para
// siempre. Con el límite, como mucho falla y deja reintentar.
function conTimeout(promesa, ms = 10000){
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error('tiempo-agotado')), ms))
  ]);
}

function money(n){
  n = Math.round(Number(n)||0);
  return '$' + n.toLocaleString('es-AR');
}

function fechaLarga(d = new Date()){
  return new Intl.DateTimeFormat('es-AR', { weekday:'long', day:'numeric', month:'long' }).format(d);
}
function fechaHora(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
}
function inicioDeHoy(){
  const d = new Date(); d.setHours(0,0,0,0); return d.getTime();
}
function diasParaVencer(fechaISO){
  if(!fechaISO) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(fechaISO + 'T00:00:00');
  return Math.round((venc - hoy) / 86400000);
}
function formatearFechaCorta(fechaISO){
  if(!fechaISO) return '';
  const d = new Date(fechaISO + 'T00:00:00');
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function estadoVencimiento(fechaISO){
  const dias = diasParaVencer(fechaISO);
  if(dias === null) return null;
  if(dias < 0) return { dias, texto: `Vencido hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'}`, color: 'red' };
  if(dias === 0) return { dias, texto: 'Vence hoy', color: 'red' };
  if(dias <= 7) return { dias, texto: `Vence en ${dias} día${dias===1?'':'s'}`, color: 'red' };
  if(dias <= 30) return { dias, texto: `Vence en ${dias} días`, color: 'amber' };
  return { dias, texto: `Vence el ${formatearFechaCorta(fechaISO)}`, color: 'green' };
}
const TEMPORADAS = ['Verano','Otoño','Invierno','Primavera'];
function esRubroRopa(){ return !!(state.negocio && state.negocio.tipo === 'ropa'); }
function temporadaActual(){
  const mes = new Date().getMonth() + 1;
  if([12,1,2].includes(mes)) return 'Verano';
  if([3,4,5].includes(mes)) return 'Otoño';
  if([6,7,8].includes(mes)) return 'Invierno';
  return 'Primavera';
}
function estadoTemporadaProducto(p){
  if(!p.temporada) return null;
  const actual = temporadaActual();
  if(p.temporada === actual) return { texto: 'En temporada', color: 'green' };
  return { texto: `Fuera de temporada (${p.temporada})`, color: 'amber' };
}
function detalleProducto(p){
  const partes = [];
  if(p.marca) partes.push(p.marca);
  if(!(p.contenidoUnidad === 'unidades' && Number(p.contenidoCantidad) === 1)){
    partes.push(`${p.contenidoCantidad} ${p.contenidoUnidad}`);
  }
  return partes.join(' · ');
}
function esCumpleanosHoy(fechaISO){
  if(!fechaISO) return false;
  const hoy = new Date();
  const d = new Date(fechaISO + 'T00:00:00');
  return d.getMonth() === hoy.getMonth() && d.getDate() === hoy.getDate();
}

/* ====================== SEEDS POR TIPO DE NEGOCIO ====================== */
// diasVenc: en cuántos días vence el lote actual (null = no se controla vencimiento para ese producto)
const SEEDS = {

    { nombre:'Papel higiénico', emoji:'🧻', marca:'Higienol', cant:4, unidad:'unidades', precio:3200, costo:2200, stock:14, stockMin:5, diasVenc:null },
  ],
  ropa: [
    { nombre:'Remera', emoji:'👕', marca:'', cant:1, unidad:'unidades', precio:8000, costo:4500, stock:20, stockMin:5, temporada:'' },
    { nombre:'Remera manga corta', emoji:'👕', marca:'', cant:1, unidad:'unidades', precio:7500, costo:4000, stock:25, stockMin:6, temporada:'Verano' },

/* ====================== TOASTS ====================== */
function toast(msg, opts = {}){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  const acciones = opts.acciones || (opts.accion ? [opts.accion] : []);
  el.innerHTML = `<span>${opts.icon || '✅'}</span><span>${msg}</span>` + acciones.map(a => `<button class="ml-2 underline decoration-2" onclick="${a.fn}">${a.texto}</button>`).join('');
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, opts.duracion || 3200);
}

/* ====================== ESCÁNER DE CÓDIGO DE BARRAS ====================== */
let lectorCodigoBarras = null;
function iniciarEscaneo(onDetectado){
  if(typeof ZXing === 'undefined' || !navigator.mediaDevices){
    toast('Tu navegador no puede usar la cámara para escanear. Escribí el código a mano.', { icon:'📷', duracion:4500 });
    return;
  }
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-3">📷 Escaneá el código de barras</div>
      <video id="video-escaner" class="w-full rounded-2xl bg-black" style="aspect-ratio:4/3; object-fit:cover;" muted playsinline></video>
      <div class="text-gray-400 text-center text-sm mt-3">Apuntá la cámara al código de barras del producto</div>
      <button onclick="cerrarModal()" class="tap w-full bg-gray-100 text-gray-700 font-bold py-3 rounded-2xl mt-4">Cancelar</button>
    </div>
  `);
  const reader = new ZXing.BrowserMultiFormatReader();
  lectorCodigoBarras = reader;
  reader.decodeFromVideoDevice(null, 'video-escaner', (resultado) => {
    if(resultado){
      const codigo = resultado.getText();
      detenerEscaneo();
      cerrarModal();
      onDetectado(codigo);
    }
  }).catch(() => {
    toast('No se pudo acceder a la cámara. Revisá los permisos del navegador.', { icon:'📷', duracion:4500 });
    cerrarModal();
  });
}
function detenerEscaneo(){
  if(lectorCodigoBarras){
    try{ lectorCodigoBarras.reset(); }catch(e){}
    lectorCodigoBarras = null;
  }
}

/* Confirmación propia de la app (no usa el confirm() nativo del navegador,
   que en algunos navegadores/celulares o WebViews falla o ni se muestra) */
let _confirmCallback = null;
function confirmarAccion(mensaje, callback, textoConfirmar = 'Sí, eliminar'){
  _confirmCallback = callback;
  abrirModal(`
    <div class="p-5 text-center">
      <div class="text-4xl mb-3">⚠️</div>
      <div class="text-lg font-bold text-gray-900 mb-6">${mensaje}</div>
      <button onclick="ejecutarConfirmacion()" class="tap w-full bg-red-600 text-white font-bold py-4 rounded-2xl text-lg mb-2">${textoConfirmar}</button>
      <button onclick="cerrarModal()" class="tap w-full bg-gray-100 text-gray-700 font-bold py-3.5 rounded-2xl text-lg">Cancelar</button>
    </div>
  `);
}
function ejecutarConfirmacion(){
  const cb = _confirmCallback;
  _confirmCallback = null;
  if(cb) cb();
}

/* ====================== ROUTER ====================== */
window.addEventListener('hashchange', renderApp);
window.addEventListener('DOMContentLoaded', () => {
  aplicarTamanoLetra();
  renderApp(); // pantalla de carga mientras Firebase confirma la sesión
  // Red de seguridad: si por lo que sea Firebase nunca llega a avisarnos si
  // hay sesión o no (bloqueo del navegador, error interno, lo que sea), no
  // nos quedamos en "Cargando..." para siempre. A los 8s forzamos a mostrar
  // igual la pantalla de inicio de sesión.
  const relojSeguridadSesion = setTimeout(() => {
    if(!sesionLista){
      sesionLista = true;
      renderApp();
      const pista = window.__ultimoErrorGlobal ? ` (${window.__ultimoErrorGlobal})` : '';
      toast('Tardó más de lo normal en confirmar la sesión. Si "Continuar con Google" no funciona, probá con mail y contraseña.' + pista, { icon:'⚠️', duracion:9000 });
    }
  }, 8000);
  window.fbOnCambioAuth(async (user) => {
    clearTimeout(relojSeguridadSesion);
    usuarioFirebase = user;
    suscripcionActual = null;
    listaSuscripciones = [];
    pantallaCrearPassword = false;
    errorCargaDatos = false;
    modoDemoAdmin = false;
    // Todo este bloque va blindado: si algo revienta acá adentro que no
    // esperábamos, no queremos que la página quede en blanco para siempre.
    // Mejor mostrar la pantalla de "no pudimos cargar" con el error real.
    try{
    if(user){
      // Si entró con Google y todavía no tiene una contraseña vinculada a la
      // cuenta, lo mandamos a crearla antes de dejarlo pasar a ningún lado.
      const tienePassword = user.providerData.some(p => p.providerId === 'password');
      if(!tienePassword) pantallaCrearPassword = true;
      try{ configPagos = await conTimeout(window.fbCargarConfigPagos()); }catch(e){ configPagos = { linkMercadoPago:'' }; }
      if(user.email === ADMIN_EMAIL){
        try{ listaSuscripciones = await conTimeout(window.fbListarSuscripciones()); }catch(e){ listaSuscripciones = []; }
        // El admin también puede tener su propio negocio de "demo" (sin pagar,
        // exento por ser admin) para mostrarle las funciones a un dueño de local.
        try{
          const datos = await conTimeout(window.fbCargarNegocio(user.uid));
          state = datos ? { ...estadoVacio(), ...datos } : estadoVacio();
          migrarProductos();
        }catch(e){
          state = estadoVacio();
        }
      } else {
        try{
          const datos = await conTimeout(window.fbCargarNegocio(user.uid));
          state = datos ? { ...estadoVacio(), ...datos } : estadoVacio();
          migrarProductos();
          if(state.negocio){
            try{
              suscripcionActual = await conTimeout(window.fbCargarSuscripcion(user.uid));
              if(!suscripcionActual){
                // Negocio creado antes de que existiera la suscripción (o algo falló al
                // crearla): la generamos ahora como "sin pagar" para que quede visible
                // en el panel admin y el dueño pueda activarla.
                suscripcionActual = { email: user.email, nombreNegocio: state.negocio.nombre, tipo: state.negocio.tipo, fechaCreacion: Date.now(), proximoVencimiento: '' };
                window.fbCrearSuscripcion(user.uid, suscripcionActual).catch(() => {});
              }
            }catch(e){
              // No se pudo confirmar el estado de pago (conexión lenta/caída): dejamos
              // suscripcionActual en null, que bloquea el acceso (vistaPago) en vez de
              // regalarlo. No es ideal, pero es la opción seguridad-primero.
              suscripcionActual = null;
            }
          }
        }catch(e){
          // OJO: nunca resetear "state" a vacío acá. Si esto fallara y siguiéramos
          // como si el negocio no existiera, el onboarding podría llegar a
          // sobrescribir en la nube los datos reales de un negocio ya existente.
          // Mejor mostrar "no pudimos cargar" y dejar reintentar.
          errorCargaDatos = true;
        }
      }
    } else {
      state = estadoVacio();
      // Si "Continuar con Google" falló porque ese mail ya tenía cuenta con
      // contraseña, no mostramos solo un error: pedimos esa contraseña acá
      // mismo para unir las dos formas de entrar a la misma cuenta.
      if(window.__errorRedirectGoogle && window.__errorRedirectGoogle.code === 'auth/account-exists-with-different-credential'){
        vinculandoGoogleEmail = (window.__errorRedirectGoogle.customData && window.__errorRedirectGoogle.customData.email) || '';
        window.__credencialGooglePendiente = window.fbCredencialGoogleDeError(window.__errorRedirectGoogle);
      }
    }
    }catch(e){
      window.__ultimoErrorGlobal = 'Error al procesar sesión: ' + ((e && (e.code || e.message)) || e);
      errorCargaDatos = true;
    }
    sesionLista = true;
    aplicarTamanoLetra();
    if(!location.hash || location.hash === '#/' || location.hash === '#'){ location.hash = '#/inicio'; }
    renderApp();
    if(!user && window.__errorRedirectGoogle && !vinculandoGoogleEmail){
      toast(traducirErrorFirebase(window.__errorRedirectGoogle), { icon:'⚠️', duracion:5000 });
    }
    window.__errorRedirectGoogle = null;
  });
});

/* Evita que scrollear con la rueda/trackpad sobre un campo numérico le cambie el valor
   (comportamiento por defecto de Chrome que hace que precios/stock "cambien solos") */
document.addEventListener('wheel', (e) => {
  if(e.target && e.target.tagName === 'INPUT' && e.target.type === 'number'){
    e.target.blur();
  }
}, { passive: true });

function aplicarTamanoLetra(){
  const tallas = { pequeno: '14px', normal: '16px', grande: '18px', 'muy-grande': '20px' };
  document.documentElement.style.fontSize = tallas[state.tamanoLetra] || '16px';
}

function ir(hash){ location.hash = hash; }

function renderApp(){
  const app = document.getElementById('app');
  if(!sesionLista){
    app.innerHTML = vistaCargando();
    return;
  }
  if(vinculandoGoogleEmail){
    app.innerHTML = vistaVincularGoogle();
    return;
  }
  if(!usuarioFirebase){
    app.innerHTML = vistaLogin();
    return;
  }
  if(pantallaCrearPassword){
    app.innerHTML = vistaCrearPassword();
    return;
  }
  if(errorCargaDatos){
    app.innerHTML = vistaErrorCarga();
    return;
  }
  if(esAdminActual() && !modoDemoAdmin){
    app.innerHTML = vistaAdmin();
    return;
  }
  if(!state.negocio){
    app.innerHTML = vistaOnboarding();
    return;
  }
  // El admin no paga: puede entrar a la app con su propio negocio de prueba
  // para mostrarle las funciones a un dueño de local antes de venderle la suscripción.
  if(!esAdminActual() && !suscripcionValida(suscripcionActual)){
    app.innerHTML = vistaPago();
    return;
  }
  const ruta = (location.hash || '#/inicio').replace('#/','');
  const [pantalla] = ruta.split('/');
  let contenido = '';
  switch(pantalla){
    case 'inicio': contenido = vistaInicio(); break;
    case 'caja': contenido = vistaCaja(); break;
    case 'fiado': contenido = vistaFiado(); break;
    case 'stock': contenido = vistaStock(); break;
    case 'vencimientos': contenido = vistaVencimientos(); break;
    case 'cierre': contenido = vistaCierre(); break;
    case 'proveedores': contenido = vistaProveedores(); break;
    case 'gastos': contenido = vistaGastos(); break;
    case 'mas': contenido = vistaMas(); break;
    case 'clientes': contenido = vistaClientes(); break;
    case 'reportes': contenido = vistaReportes(); break;
    case 'config': contenido = vistaConfig(); break;
    default: contenido = vistaInicio();
  }
  app.innerHTML = `
    ${esAdminActual() && modoDemoAdmin ? `
    <div class="bg-amber-500 text-white text-center text-sm font-bold py-2 px-4 flex items-center justify-center gap-3">
      <span>👑 Modo demo (cuenta admin)</span>
      <button onclick="salirDemoAdmin()" class="underline">Volver al panel admin</button>
    </div>` : ''}
    ${cabecera()}
    <div class="px-4">${contenido}</div>
    ${navInferior(pantalla)}
  `;
  if(pantalla === 'inicio') dibujarGraficoSemana();
  if(pantalla === 'reportes') dibujarGraficoReportes();
}

function confirmarCrearPassword(){
  const p1 = document.getElementById('crear-password').value;
  const p2 = document.getElementById('crear-password-confirmar').value;
  if(!p1 || p1.length < 6){ toast('La contraseña tiene que tener al menos 6 caracteres', {icon:'🔒'}); return; }
  if(p1 !== p2){ toast('Las contraseñas no coinciden', {icon:'⚠️'}); return; }
  window.fbVincularPassword(p1)
    .then(() => { pantallaCrearPassword = false; toast('Contraseña creada', {icon:'✅'}); renderApp(); })
    .catch(err => toast(traducirErrorFirebase(err), {icon:'⚠️', duracion:4500}));
}

  guardar();

    suscripcionActual = { email: usuarioFirebase.email, nombreNegocio: onboardingNombre, tipo, fechaCreacion: Date.now(), proximoVencimiento: '' };
    window.fbCrearSuscripcion(usuarioFirebase.uid, suscripcionActual).catch(() => {});

  ir('#/inicio');
  renderApp();
}

function compartirResumenDia(){
  const hoy = inicioDeHoy();
  const ventasHoy = state.ventas.filter(v => v.fecha >= hoy);
  const totalHoy = ventasHoy.reduce((s,v)=>s+v.total,0);
  const gananciaHoy = ventasHoy.reduce((s,v)=>s+v.ganancia,0);
  const bajoStock = state.productos.filter(p => p.stock <= p.stockMin).length;
  const msg = `📊 Resumen de hoy - ${state.negocio.nombre}\n\n💰 Vendido: ${money(totalHoy)}\n📈 Ganancia: ${money(gananciaHoy)}\n🧾 Ventas: ${ventasHoy.length}`
    + (bajoStock ? `\n⚠️ ${bajoStock} producto(s) por reponer` : '');
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}
function tarjetaStat(emoji, label, valor, colorFondo, colorTexto, onclick){
  return `
  <button onclick="${onclick}" class="tap card p-4 text-left flex flex-col gap-2">
    <div class="icon-badge" style="background:${colorFondo}; color:${colorTexto};">${emoji}</div>
    <div>
      <div class="section-label">${label}</div>
      <div class="text-2xl font-extrabold text-gray-900 mt-0.5">${valor}</div>
    </div>
  </button>`;
}
function dibujarGraficoSemana(){
  const ctx = document.getElementById('chart-semana');
  if(!ctx) return;
  const dias = [];
  const totales = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const dSig = d.getTime() + 24*3600*1000;
    dias.push(d.toLocaleDateString('es-AR',{weekday:'short'}));
    const total = state.ventas.filter(v => v.fecha >= d.getTime() && v.fecha < dSig).reduce((s,v)=>s+v.total,0);
    totales.push(total);
  }
  new Chart(ctx, {
    type: 'bar',
    data: { labels: dias, datasets: [{ data: totales, backgroundColor: '#4338ca', borderRadius: 8 }] },
    options: {
      plugins: { legend: { display:false } },

let carrito = {}; // productoId -> cantidad
let carritoCombos = {}; // comboId -> cantidad
let busquedaCaja = '';
let filtroCategoriaCaja = '';

function vistaCaja(){
  const texto = busquedaCaja.trim().toLowerCase();
  const enVistaCombos = !texto && filtroCategoriaCaja === '__combos__';
  const filtroProductoEfectivo = filtroCategoriaCaja === '__combos__' ? '' : filtroCategoriaCaja;

  const productos = state.productos
    .filter(p => {
      if(!texto) return true;
      const cat = state.categorias.find(c=>c.id===p.categoriaId);
      return p.nombre.toLowerCase().includes(texto) || (p.marca||'').toLowerCase().includes(texto) || (cat && cat.nombre.toLowerCase().includes(texto)) || (p.codigoBarras && p.codigoBarras.includes(texto));
    })
    .filter(p => !filtroProductoEfectivo || p.categoriaId === filtroProductoEfectivo);

  const combosVisibles = enVistaCombos
    ? state.combos
    : (texto ? state.combos.filter(c => c.nombre.toLowerCase().includes(texto)) : []);

  const items = Object.entries(carrito).filter(([,c])=>c>0);
  const combosCarrito = Object.entries(carritoCombos).filter(([,c])=>c>0);
  const totalItems = items.reduce((s,[id,c]) => { const p = state.productos.find(x=>x.id===id); return s + (p?p.precio*c:0); }, 0);
  const totalCombos = combosCarrito.reduce((s,[id,c]) => { const cb = state.combos.find(x=>x.id===id); return s + (cb?cb.precio*c:0); }, 0);
  const total = totalItems + totalCombos;
  const cantidadTotal = items.reduce((s,[,c])=>s+c,0) + combosCarrito.reduce((s,[,c])=>s+c,0);
  const hayCarrito = items.length>0 || combosCarrito.length>0;

  return `
  <div class="grid grid-cols-2 gap-2 mt-2 mb-3">
    <button onclick="iniciarVoz()" id="btn-voz" class="tap bg-red-50 border-2 border-red-200 text-red-700 font-bold text-lg py-4 rounded-2xl flex items-center justify-center gap-2">
      🎤 Por voz
    </button>
    <button onclick="escanearParaVender()" class="tap bg-indigo-50 border-2 border-indigo-100 text-indigo-700 font-bold text-lg py-4 rounded-2xl flex items-center justify-center gap-2">
      📷 Escanear

  </div>

  <input id="input-busqueda-caja" type="text" value="${busquedaCaja}" oninput="busquedaCaja=this.value; renderApp();" placeholder="Buscar producto o categoría..."
    class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg mb-3 focus:border-indigo-600 focus:outline-none" />

  <div class="flex gap-2 mb-3 overflow-x-auto pb-1">
    <button onclick="filtroCategoriaCaja=''; renderApp();" class="tap flex-shrink-0 px-4 py-2 rounded-full font-bold text-sm ${filtroCategoriaCaja===''?'bg-indigo-700 text-white':'bg-white text-gray-500 border-2 border-gray-200'}">Todos</button>
    ${state.categorias.map(c=>`<button onclick="filtroCategoriaCaja='${c.id}'; renderApp();" class="tap flex-shrink-0 px-4 py-2 rounded-full font-bold text-sm ${filtroCategoriaCaja===c.id?'bg-indigo-700 text-white':'bg-white text-gray-500 border-2 border-gray-200'}">${c.nombre}</button>`).join('')}
    <button onclick="filtroCategoriaCaja='__combos__'; renderApp();" class="tap flex-shrink-0 px-4 py-2 rounded-full font-bold text-sm ${filtroCategoriaCaja==='__combos__'?'bg-indigo-700 text-white':'bg-white text-gray-500 border-2 border-gray-200'}">🎁 Combos</button>

let ultimaVentaId = null;
function confirmarVenta(metodo, clienteId = null){
  const items = Object.entries(carrito).filter(([,c])=>c>0).map(([id,c])=>({ productoId:id, cantidad:c }));
  const combosVendidos = Object.entries(carritoCombos).filter(([,c])=>c>0).map(([id,c])=>({ comboId:id, cantidad:c }));
  if(!items.length && !combosVendidos.length) return;
  let total = 0, ganancia = 0;
  items.forEach(it => {
    const p = state.productos.find(x=>x.id===it.productoId);
    total += p.precio * it.cantidad;
    ganancia += (p.precio - p.costo) * it.cantidad;
    p.stock = Math.max(0, p.stock - it.cantidad);
  });
  combosVendidos.forEach(cv => {
    const combo = state.combos.find(x=>x.id===cv.comboId);
    if(!combo) return;
    let costoCombo = 0;
    combo.itemIds.forEach(ci => {
      const p = state.productos.find(x=>x.id===ci.productoId);
      if(!p) return;
      costoCombo += p.costo * ci.cantidad;
      p.stock = Math.max(0, p.stock - ci.cantidad * cv.cantidad);
    });
    total += combo.precio * cv.cantidad;
    ganancia += (combo.precio - costoCombo) * cv.cantidad;
  });
  const venta = { id: uid(), fecha: Date.now(), items, combos: combosVendidos, total, ganancia, metodoPago: metodo, clienteId, vendedorId: state.usuarioActualId || '' };
  state.ventas.push(venta);
  if(metodo === 'fiado' && clienteId){
    const cliente = state.clientes.find(c=>c.id===clienteId);
    cliente.fiado = (cliente.fiado||0) + total;
    state.fiadoMovimientos.push({ id: uid(), clienteId, tipo:'debe', monto: total, fecha: Date.now(), detalle: 'Compra fiada', ventaId: venta.id });
  }
  ultimaVentaId = venta.id;
  guardar();
  carrito = {};
  carritoCombos = {};
  cerrarModal();
  ir('#/inicio');
  renderApp();
  toast(`¡Venta registrada! ${money(total)}`, { icon:'✅', acciones:[
    { fn:'deshacerVenta()', texto:'Deshacer' },
    { fn:`imprimirComprobante('${venta.id}')`, texto:'🖨️ Imprimir' }
  ], duracion: 7000 });
}
function revertirVenta(venta){
  venta.items.forEach(it => {
    const p = state.productos.find(x=>x.id===it.productoId);
    if(p) p.stock += it.cantidad;
  });
  (venta.combos||[]).forEach(cv => {
    const combo = state.combos.find(x=>x.id===cv.comboId);
    if(!combo) return;
    combo.itemIds.forEach(ci => {
      const p = state.productos.find(x=>x.id===ci.productoId);
      if(p) p.stock += ci.cantidad * cv.cantidad;
    });
  });
  if(venta.metodoPago === 'fiado' && venta.clienteId){
    const cliente = state.clientes.find(c=>c.id===venta.clienteId);
    if(cliente) cliente.fiado = Math.max(0,(cliente.fiado||0) - venta.total);
    state.fiadoMovimientos = state.fiadoMovimientos.filter(m => m.ventaId !== venta.id);
  }
  state.ventas = state.ventas.filter(v=>v.id!==venta.id);
}
function deshacerVenta(){
  const venta = state.ventas.find(v=>v.id===ultimaVentaId);
  if(!venta) return;
  revertirVenta(venta);
  guardar();
  renderApp();
  toast('Venta deshecha', { icon:'↩️' });
}

/* ---- Reconocimiento de voz real (Web Speech API), gratis, sin claves ---- */
function iniciarVoz(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('btn-voz');
  if(!SR){
    toast('Tu navegador no tiene micrófono disponible. Usá los productos de abajo 👇', { icon:'🎤', duracion:4500 });
    return;
  }
  const rec = new SR();
  rec.lang = 'es-AR';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  if(btn){ btn.classList.add('pulse-mic'); btn.innerHTML = '🎙️ Escuchando...'; }
  rec.onresult = (e) => {
    const texto = e.results[0][0].transcript;
    procesarTextoVoz(texto);
  };
  rec.onerror = () => {
    toast('No te escuché bien, probá de nuevo o tocá un producto', { icon:'🎤' });
  };
  rec.onend = () => {
    if(btn){ btn.classList.remove('pulse-mic'); btn.innerHTML = '🎤 Por voz'; }
  };
  rec.start();
}

const NUMEROS_TEXTO = { un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10 };

function procesarTextoVoz(textoOriginal){
  const texto = textoOriginal.toLowerCase();
  const palabras = texto.split(/\s+/);
  let encontrados = [];

  state.productos.forEach(p => {
    const primeraPalabra = p.nombre.toLowerCase().split(' ')[0];
    const singular = primeraPalabra.endsWith('es') ? primeraPalabra.slice(0,-2)
      : primeraPalabra.endsWith('s') ? primeraPalabra.slice(0,-1)
      : primeraPalabra;
    let idx = -1;
    palabras.forEach((w, i) => {
      const wLimpia = w.replace(/[.,!?]/g,'');
      // exige al menos 3 letras y que la palabra dicha empiece igual que el producto,
      // para no confundir conectores cortos ("y", "un") con nombres de productos
      if(idx === -1 && wLimpia.length >= 3 && singular.length >= 3 && (wLimpia === primeraPalabra || wLimpia.startsWith(singular))){
        idx = i;
      }
    });
    if(idx !== -1){
      let cantidad = 1;
      for(let j = Math.max(0, idx-2); j < idx; j++){
        const w = palabras[j].replace(/[.,!?]/g,'');
        if(/^\d+$/.test(w)) cantidad = parseInt(w);
        else if(NUMEROS_TEXTO[w]) cantidad = NUMEROS_TEXTO[w];
      }
      encontrados.push({ producto: p, cantidad });
    }
  });

  if(!encontrados.length){
    toast(`Escuché "${textoOriginal}" pero no reconocí ningún producto. Probá tocando los productos.`, { icon:'🤔', duracion:4500 });
    return;
  }
  encontrados.forEach(({producto, cantidad}) => agregarAlCarrito(producto.id, cantidad));
  toast(`Agregué: ${encontrados.map(e=>e.cantidad+' '+e.producto.nombre).join(', ')}`, { icon:'🎤', duracion:4000 });
}

/* ====================== STOCK ====================== */
let filtroStock = 'todos';
let busquedaStock = '';
function vistaStock(){
  const texto = busquedaStock.trim().toLowerCase();
  let productos = state.productos.filter(p => !texto || p.nombre.toLowerCase().includes(texto) || (p.marca||'').toLowerCase().includes(texto) || (p.codigoBarras && p.codigoBarras.includes(texto)));

  if(filtroStock === 'bajo'){
    productos = productos.filter(p=>p.stock<=p.stockMin);
    productos.sort((a,b)=> (a.stock/Math.max(1,a.stockMin)) - (b.stock/Math.max(1,b.stockMin)));
  }

  const vacio = `<div class="text-center py-16 text-gray-400">${texto ? 'No encontramos ningún producto con ese nombre' : 'Sin productos todavía'}</div>`;
  let listaHTML;
  if(filtroStock === 'bajo' || texto){
    listaHTML = productos.map(tarjetaProductoStock).join('') || vacio;
  } else {
    const grupos = [
      ...state.categorias.map(c => ({ id:c.id, nombre:c.nombre, productos: productos.filter(p=>p.categoriaId===c.id) })),
      { id:'', nombre:'Sin categoría', productos: productos.filter(p=>!p.categoriaId) }
    ].filter(g => g.productos.length);
    const mostrarEncabezados = grupos.length > 1;
    listaHTML = grupos.map(g => `
      ${mostrarEncabezados ? `<div class="section-label mt-5 mb-2">${g.nombre} (${g.productos.length})</div>` : ''}
      ${g.productos.map(tarjetaProductoStock).join('')}
    `).join('') || vacio;
  }

  return `
  <input id="input-busqueda-stock" type="text" value="${busquedaStock}" oninput="busquedaStock=this.value; renderApp();" placeholder="Buscar producto..."
    class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg mt-2 mb-3 focus:border-indigo-600 focus:outline-none" />

  <div class="flex gap-2 mb-3">
    <button onclick="filtroStock='todos'; renderApp();" class="tap flex-1 py-2.5 rounded-xl font-bold ${filtroStock==='todos'?'bg-indigo-700 text-white':'bg-white text-gray-500'}">Todos (${productos.length})</button>
    <button onclick="filtroStock='bajo'; renderApp();" class="tap flex-1 py-2.5 rounded-xl font-bold ${filtroStock==='bajo'?'bg-red-600 text-white':'bg-white text-gray-500'}">Por reponer (${state.productos.filter(p=>(!texto || p.nombre.toLowerCase().includes(texto) || (p.marca||'').toLowerCase().includes(texto)) && p.stock<=p.stockMin).length})</button>
  </div>

  <button onclick="mostrarFormProducto()" class="tap w-full bg-indigo-700 text-white font-bold text-lg py-3.5 rounded-2xl mb-2">+ Nuevo producto</button>
  <div class="grid grid-cols-2 gap-2 mb-4">
    <button onclick="mostrarCategorias()" class="tap bg-white text-gray-700 border-2 border-gray-200 font-bold text-lg py-3.5 rounded-2xl">📂 Categorías</button>
    <button onclick="mostrarCombos()" class="tap bg-white text-gray-700 border-2 border-gray-200 font-bold text-lg py-3.5 rounded-2xl">🎁 Combos</button>
  </div>

  ${listaHTML}
  `;
}
function tarjetaProductoStock(p){
  const ratio = p.stock / Math.max(1,p.stockMin);
  const color = ratio <= 1 ? 'bg-red-500' : ratio <= 2 ? 'bg-amber-400' : 'bg-green-500';
  const est = !esRubroRopa() && p.vencimiento ? estadoVencimiento(p.vencimiento) : null;
  const estTemp = esRubroRopa() ? estadoTemporadaProducto(p) : null;
  const colVenc = est && est.color==='red' ? {bg:'#fef2f2', text:'#dc2626'} : {bg:'#fffbeb', text:'#b45309'};
  const colTemp = estTemp && estTemp.color==='green' ? {bg:'#ecfdf5', text:'#059669'} : {bg:'#fffbeb', text:'#b45309'};
  return `
  <div class="card p-4 mb-3">
    <div class="flex items-center justify-between mb-2">
      <button onclick="mostrarFormProducto('${p.id}')" class="text-left flex items-center gap-3 flex-1 min-w-0">
        <span class="text-2xl flex-shrink-0">${p.emoji}</span>
        <span class="min-w-0">
          <span class="font-bold text-gray-800 block truncate">${p.nombre}</span>
          ${detalleProducto(p) ? `<span class="text-gray-400 text-sm block truncate">${detalleProducto(p)}</span>` : ''}
        </span>
      </button>
      <span class="text-gray-400 text-sm whitespace-nowrap ml-2">${money(p.precio)}</span>
    </div>
    ${est && est.dias <= 30 ? `<div class="mb-2"><span class="badge-venc" style="background:${colVenc.bg};color:${colVenc.text};">${est.texto}</span></div>` : ''}
    ${estTemp && estTemp.color==='amber' ? `<div class="mb-2"><span class="badge-venc" style="background:${colTemp.bg};color:${colTemp.text};">${estTemp.texto}</span></div>` : ''}
    <div class="w-full h-2 bg-gray-100 rounded-full mb-2 overflow-hidden">
      <div class="h-full ${color}" style="width:${Math.min(100, ratio*50)}%"></div>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-gray-500 font-semibold">Quedan: <span class="text-gray-900">${p.stock}</span></span>
      <div class="flex items-center gap-2">
        <button onclick="ajustarStock('${p.id}',-1)" class="tap w-10 h-10 rounded-full bg-gray-100 font-bold text-xl">−</button>
        <button onclick="ajustarStock('${p.id}',1)" class="tap w-10 h-10 rounded-full bg-gray-100 font-bold text-xl">+</button>
      </div>
    </div>
  </div>`;
}
function ajustarStock(id, delta){
  const p = state.productos.find(x=>x.id===id);
  p.stock = Math.max(0, p.stock + delta);
  guardar();
  renderApp();
}

            </div>
          </div>`).join('')}
      </div>
      <div class="text-gray-500 text-sm mb-3" id="cb-resumen">${resumenComboTexto()}</div>

function resumenComboTexto(){
  let costo = 0, sueltoPrecio = 0, cantTotal = 0;
  Object.entries(comboItemsTemp).forEach(([pid,c]) => {
    if(c<=0) return;
    const p = state.productos.find(x=>x.id===pid);
    if(!p) return;
    costo += p.costo * c;
    sueltoPrecio += p.precio * c;
    cantTotal += c;
  });
  if(!cantTotal) return 'Elegí al menos un producto para el combo.';
  return `Costo de estos productos: ${money(costo)} · Precio si los vendés sueltos: ${money(sueltoPrecio)}`;
}
function ajustarComboItem(productoId, delta){
  comboItemsTemp[productoId] = Math.max(0, (comboItemsTemp[productoId]||0) + delta);
  const span = document.getElementById('cb-cant-'+productoId);
  if(span) span.textContent = comboItemsTemp[productoId];
  const resumen = document.getElementById('cb-resumen');
  if(resumen) resumen.textContent = resumenComboTexto();
}
function guardarCombo(id){

  const itemIds = Object.entries(comboItemsTemp).filter(([,c])=>c>0).map(([productoId,cantidad])=>({productoId,cantidad}));
  if(!nombre){ toast('Escribí el nombre del combo', {icon:'✍️'}); return; }
  if(!itemIds.length){ toast('Elegí al menos un producto', {icon:'📦'}); return; }
  if(id){
    Object.assign(state.combos.find(c=>c.id===id), { nombre, emoji, precio, itemIds });
  } else {
    state.combos.push({ id: uid(), nombre, emoji, precio, itemIds });
  }
  guardar();
  cerrarModal();
  renderApp();
  toast('Combo guardado', {icon:'✅'});
}
function eliminarCombo(id){
  confirmarAccion('¿Eliminar este combo?', () => {

    guardar();
    cerrarModal();
    renderApp();

function escanearParaFormProducto(id){
  const valores = {
    emoji: document.getElementById('pf-emoji').value,
    nombre: document.getElementById('pf-nombre').value,
    marca: document.getElementById('pf-marca').value,
    contenidoCantidad: document.getElementById('pf-contenido-cant').value,
    contenidoUnidad: document.getElementById('pf-contenido-unidad').value,
    categoriaId: document.getElementById('pf-categoria').value,
    proveedorId: document.getElementById('pf-proveedor').value,
    precio: document.getElementById('pf-precio').value,
    costo: document.getElementById('pf-costo').value,
    stock: document.getElementById('pf-stock').value,
    stockMin: document.getElementById('pf-stockmin').value,
    vencimiento: document.getElementById('pf-vencimiento') ? document.getElementById('pf-vencimiento').value : '',
    temporada: document.getElementById('pf-temporada') ? document.getElementById('pf-temporada').value : '',
  };
  iniciarEscaneo((codigo) => {
    valores.codigoBarras = codigo;
    mostrarFormProducto(id || null, valores);
    toast('Código escaneado', { icon:'📷' });
  });
}
function guardarProducto(id){
  const nombre = document.getElementById('pf-nombre').value.trim();
  const marca = document.getElementById('pf-marca').value.trim();
  const contenidoCantidad = parseFloat(document.getElementById('pf-contenido-cant').value) || 1;
  const contenidoUnidad = document.getElementById('pf-contenido-unidad').value;
  const categoriaId = document.getElementById('pf-categoria').value;
  const proveedorId = document.getElementById('pf-proveedor').value;
  const codigoBarras = document.getElementById('pf-codigo-barras').value.trim();
  const precio = parseFloat(document.getElementById('pf-precio').value) || 0;
  const costo = parseFloat(document.getElementById('pf-costo').value) || 0;
  const stock = parseInt(document.getElementById('pf-stock').value) || 0;
  const stockMin = parseInt(document.getElementById('pf-stockmin').value) || 0;
  const vencimiento = document.getElementById('pf-vencimiento') ? document.getElementById('pf-vencimiento').value || '' : '';
  const temporada = document.getElementById('pf-temporada') ? document.getElementById('pf-temporada').value || '' : '';
  const emoji = document.getElementById('pf-emoji').value.trim() || '🛒';
  if(!nombre){ toast('Escribí el nombre del producto', {icon:'✍️'}); return; }
  if(id){
    const p = state.productos.find(x=>x.id===id);
    Object.assign(p, { nombre, marca, contenidoCantidad, contenidoUnidad, categoriaId, proveedorId, codigoBarras, precio, costo, stock, stockMin, vencimiento, temporada, emoji });
  } else {
    state.productos.push({ id: uid(), nombre, marca, contenidoCantidad, contenidoUnidad, categoriaId, proveedorId, codigoBarras, precio, costo, stock, stockMin, vencimiento, temporada, emoji });
  }
  guardar();
  cerrarModal();
  renderApp();
  toast('Producto guardado', {icon:'✅'});
}
function eliminarProducto(id){
  confirmarAccion('¿Seguro que querés eliminar este producto?', () => {
    state.productos = state.productos.filter(p=>p.id!==id);
    guardar();
    cerrarModal();
    renderApp();
  });
}

      <button onclick="mostrarFormProducto('${p.id}')" class="tap w-full bg-gray-50 text-gray-700 font-bold py-2.5 rounded-xl text-sm">Actualizar fecha</button>
    </div>`;
  }).join('') : `

    <div class="text-5xl mb-3">⏳</div>
    <div class="font-semibold">${filtroVencimientos==='urgentes' ? 'No hay nada urgente, todo en orden' : 'Todavía no cargaste fechas de vencimiento'}</div>

/* ====================== CIERRE DE CAJA ====================== */
let cierreFondoInicial = 0;
let cierreContado = null;
function vistaCierre(){
  if(!usuarioEsAdmin()){
    return `
    <div class="text-center py-20 text-gray-400">
      <div class="text-5xl mb-3">🔒</div>
      <div class="font-semibold text-gray-600">El cierre de caja es solo para el administrador.</div>
      <div class="text-sm mt-1">Pedile a un administrador que lo haga.</div>
    </div>`;
  }
  const hoy = inicioDeHoy();
  const eliminacionesHoy = state.eliminaciones.filter(e=>e.fecha>=hoy);
  const ventasHoy = state.ventas.filter(v=>v.fecha>=hoy);
  const efectivoVentas = ventasHoy.filter(v=>v.metodoPago==='efectivo').reduce((s,v)=>s+v.total,0);
  const transferenciaVentas = ventasHoy.filter(v=>v.metodoPago==='transferencia').reduce((s,v)=>s+v.total,0);
  const fiadoVentas = ventasHoy.filter(v=>v.metodoPago==='fiado').reduce((s,v)=>s+v.total,0);
  const pagosFiadoHoy = state.fiadoMovimientos.filter(m=>m.tipo==='pago' && m.fecha>=hoy).reduce((s,m)=>s+m.monto,0);
  const efectivoEsperado = cierreFondoInicial + efectivoVentas + pagosFiadoHoy;
  const diferencia = cierreContado !== null ? cierreContado - efectivoEsperado : null;

  return `
  <div class="card p-4 mt-2 mb-4">
    <div class="section-label mb-2">Movimientos de hoy</div>
    <div class="flex flex-col gap-2">
      <div class="flex justify-between text-gray-700"><span>💵 Ventas en efectivo</span><span class="font-bold">${money(efectivoVentas)}</span></div>
      <div class="flex justify-between text-gray-700"><span>📲 Transferencias</span><span class="font-bold">${money(transferenciaVentas)}</span></div>
      <div class="flex justify-between text-gray-700"><span>📒 Ventas fiadas</span><span class="font-bold">${money(fiadoVentas)}</span></div>
      <div class="flex justify-between text-gray-700"><span>💰 Cobros de fiado</span><span class="font-bold">${money(pagosFiadoHoy)}</span></div>
    </div>
  </div>

  <div class="card p-4 mb-4">
    <label class="font-semibold text-gray-600">¿Con cuánto efectivo abriste la caja hoy?</label>
    <input id="cierre-fondo" type="number" inputmode="decimal" value="${cierreFondoInicial||''}" placeholder="0" oninput="cierreFondoInicial=parseFloat(this.value)||0; renderApp();" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg my-2" />
    <div class="flex items-center justify-between mt-3 pt-3 border-t">
      <span class="font-bold text-gray-700">Efectivo esperado</span>
      <span class="text-2xl font-extrabold text-indigo-700">${money(efectivoEsperado)}</span>
    </div>
  </div>

  <div class="card p-4 mb-4">
    <label class="font-semibold text-gray-600">Contá el efectivo real que tenés y escribilo acá</label>
    <input id="cierre-contado" type="number" inputmode="decimal" placeholder="0" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg my-2" />
    <button onclick="calcularCierre()" class="tap w-full bg-indigo-700 text-white font-bold py-3.5 rounded-2xl mt-2">Calcular diferencia</button>
  </div>

  ${cierreContado !== null ? `
  <div class="card p-4 mb-4 text-center">
    <div class="text-4xl mb-2">${diferencia===0?'✅':diferencia>0?'🤔':'⚠️'}</div>
    <div class="text-lg font-bold ${diferencia===0?'text-green-600':diferencia>0?'text-amber-600':'text-red-600'}">
      ${diferencia===0?'¡Perfecto, cuadra!':diferencia>0?`Sobran ${money(diferencia)}`:`Faltan ${money(Math.abs(diferencia))}`}
    </div>
    <button onclick="guardarCierre()" class="tap w-full bg-gray-100 text-gray-700 font-bold py-3 rounded-2xl mt-3">💾 Guardar este cierre</button>
  </div>` : ''}

  ${state.cierres.length ? `
  <div class="section-label mb-2 mt-2">Historial de cierres</div>
  ${[...state.cierres].sort((a,b)=>b.fecha-a.fecha).slice(0,7).map(c => `
    <div class="card p-3 mb-2 flex items-center justify-between">
      <span class="text-gray-700 font-semibold">${new Date(c.fecha).toLocaleDateString('es-AR')}</span>
      <span class="font-bold ${c.diferencia===0?'text-green-600':c.diferencia>0?'text-amber-600':'text-red-600'}">${c.diferencia===0?'Cuadró':c.diferencia>0?'Sobró '+money(c.diferencia):'Faltó '+money(Math.abs(c.diferencia))}</span>
    </div>
  `).join('')}` : ''}

  ${eliminacionesHoy.length ? `
  <div class="section-label mb-2 mt-4 text-red-600">🗑️ Ventas eliminadas hoy</div>
  ${eliminacionesHoy.map(e => `
    <div class="card p-3 mb-2">
      <div class="flex items-center justify-between">
        <span class="text-gray-700 font-semibold">${e.quienNombre}</span>
        <span class="font-bold text-red-600">${money(e.monto)}</span>
      </div>
      <div class="text-gray-400 text-sm">${fechaHora(e.fecha)} · venta original del ${fechaHora(e.ventaFecha)}</div>
    </div>
  `).join('')}` : ''}
  `;
}
function calcularCierre(){
  const val = parseFloat(document.getElementById('cierre-contado').value);
  cierreContado = isNaN(val) ? 0 : val;
  renderApp();
}
function guardarCierre(){
  const hoy = inicioDeHoy();
  const ventasHoy = state.ventas.filter(v=>v.fecha>=hoy);
  const efectivoVentas = ventasHoy.filter(v=>v.metodoPago==='efectivo').reduce((s,v)=>s+v.total,0);
  const pagosFiadoHoy = state.fiadoMovimientos.filter(m=>m.tipo==='pago' && m.fecha>=hoy).reduce((s,m)=>s+m.monto,0);
  const efectivoEsperado = cierreFondoInicial + efectivoVentas + pagosFiadoHoy;
  const diferencia = cierreContado - efectivoEsperado;
  state.cierres.push({ id: uid(), fecha: Date.now(), fondoInicial: cierreFondoInicial, esperado: efectivoEsperado, contado: cierreContado, diferencia });
  guardar();
  cierreContado = null;
  cierreFondoInicial = 0;
  renderApp();
  toast('Cierre guardado', {icon:'💾'});
}

  { id:'sueldos', emoji:'👥', nombre:'Sueldos' },
  { id:'servicios', emoji:'💡', nombre:'Servicios' },

function nombreCategoriaGasto(categoriaId){ return (GASTO_CATEGORIAS.find(c=>c.id===categoriaId)||{}).nombre || 'Otros'; }

  if(filtroPeriodoReportes !== 'mes') return state.gastos;

  ${gastosOrdenados.length ? gastosOrdenados.map(g => `
    <button onclick="mostrarFormGasto('${g.id}')" class="tap card p-4 mb-3 w-full flex items-center justify-between text-left">
      <div class="flex items-center gap-3 min-w-0">

        </span>
      </div>

/* ====================== REPORTES ====================== */
let filtroPeriodoReportes = 'mes';
function formatearCambio(actual, anterior){
  if(anterior <= 0){
    return actual > 0 ? { texto: 'primera vez con ventas', color: '#059669' } : { texto: 'sin datos del mes pasado', color: '#9ca3af' };
  }
  const pct = ((actual - anterior) / anterior) * 100;
  const signo = pct >= 0 ? '▲' : '▼';
  return { texto: `${signo} ${Math.abs(pct).toFixed(0)}%`, color: pct >= 0 ? '#059669' : '#dc2626' };
}
function calcularRanking(ventasFiltradas){
  const stats = {};
  ventasFiltradas.forEach(v => {
    v.items.forEach(it => {
      const p = state.productos.find(x=>x.id===it.productoId);
      const key = 'p:'+it.productoId;
      if(!stats[key]) stats[key] = { emoji: p?p.emoji:'❔', nombre: p?p.nombre:'(producto eliminado)', cantidad:0, ganancia:0 };
      stats[key].cantidad += it.cantidad;
      if(p) stats[key].ganancia += (p.precio - p.costo) * it.cantidad;
    });
    (v.combos||[]).forEach(cv => {
      const c = state.combos.find(x=>x.id===cv.comboId);
      const key = 'c:'+cv.comboId;
      if(!stats[key]) stats[key] = { emoji: c?c.emoji:'🎁', nombre: c?(c.nombre+' (combo)'):'(combo eliminado)', cantidad:0, ganancia:0 };
      stats[key].cantidad += cv.cantidad;
      if(c){
        let costoCombo = 0;
        c.itemIds.forEach(ci => { const p = state.productos.find(x=>x.id===ci.productoId); if(p) costoCombo += p.costo*ci.cantidad; });
        stats[key].ganancia += (c.precio - costoCombo) * cv.cantidad;
      }
    });
  });
  return Object.values(stats);
}
function vistaReportes(){
  const hoy = new Date();
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getTime();
  const inicioMesAnterior = new Date(hoy.getFullYear(), hoy.getMonth()-1, 1).getTime();
  const ventasFiltradas = filtroPeriodoReportes === 'mes' ? state.ventas.filter(v => v.fecha >= inicioMes) : state.ventas;
  const ventasOrdenadas = [...ventasFiltradas].sort((a,b)=>b.fecha-a.fecha);
  const totalPeriodo = ventasOrdenadas.reduce((s,v)=>s+v.total,0);
  const gananciaPeriodo = ventasOrdenadas.reduce((s,v)=>s+v.ganancia,0);

  const ventasMesAnterior = state.ventas.filter(v => v.fecha >= inicioMesAnterior && v.fecha < inicioMes);
  const totalMesAnterior = ventasMesAnterior.reduce((s,v)=>s+v.total,0);
  const gananciaMesAnterior = ventasMesAnterior.reduce((s,v)=>s+v.ganancia,0);
  const cambioVentas = formatearCambio(totalPeriodo, totalMesAnterior);
  const cambioGanancia = formatearCambio(gananciaPeriodo, gananciaMesAnterior);

  const ranking = calcularRanking(ventasFiltradas);
  const gastosPeriodo = gastosPeriodoActual().reduce((s,g)=>s+g.monto,0);
  const gananciaNeta = gananciaPeriodo - gastosPeriodo;

  const porVendedor = {};
  if(state.usuarios.length){
    ventasFiltradas.forEach(v => {
      const key = v.vendedorId || '__sin__';
      if(!porVendedor[key]) porVendedor[key] = { nombre: (state.usuarios.find(u=>u.id===key)||{}).nombre || 'Sin asignar', total:0, ganancia:0 };
      porVendedor[key].total += v.total;
      porVendedor[key].ganancia += v.ganancia;
    });
  }
  const ventasPorVendedor = Object.values(porVendedor).sort((a,b)=>b.total-a.total);

  return `

    <button onclick="filtroPeriodoReportes='mes'; renderApp();" class="tap flex-1 py-2.5 rounded-xl font-bold ${filtroPeriodoReportes==='mes'?'bg-indigo-700 text-white':'bg-white text-gray-500'}">Este mes</button>
    <button onclick="filtroPeriodoReportes='todo'; renderApp();" class="tap flex-1 py-2.5 rounded-xl font-bold ${filtroPeriodoReportes==='todo'?'bg-indigo-700 text-white':'bg-white text-gray-500'}">Todo el historial</button>

    ${tarjetaStat('💰', filtroPeriodoReportes==='mes' ? 'Vendido este mes' : 'Total vendido', money(totalPeriodo), '#ecfdf5', '#059669', "")}
    ${tarjetaStat('📈', filtroPeriodoReportes==='mes' ? 'Ganancia este mes' : 'Ganancia total', money(gananciaPeriodo), '#eef0ff', '#4338ca', "")}
  </div>

  ${filtroPeriodoReportes==='mes' && (totalMesAnterior>0 || totalPeriodo>0) ? `
  <div class="card p-4 mb-4">
    <div class="section-label mb-2">📊 Comparado con el mes pasado</div>
    <div class="flex items-center justify-between py-1.5">
      <span class="text-gray-700">Vendido</span>
      <span class="font-bold" style="color:${cambioVentas.color}">${cambioVentas.texto}</span>
    </div>
    <div class="flex items-center justify-between py-1.5">
      <span class="text-gray-700">Ganancia</span>
      <span class="font-bold" style="color:${cambioGanancia.color}">${cambioGanancia.texto}</span>
    </div>
  </div>` : ''}

  <div class="card p-4 mb-4">
    <div class="section-label mb-2">${filtroPeriodoReportes==='mes' ? 'Ganancia por día, este mes' : 'Ganancia de los últimos 14 días'}</div>
    <canvas id="chart-reportes" height="160"></canvas>
  </div>

  ${ranking.length ? `
  <div class="card p-4 mb-4">
    <div class="section-label mb-2">🏆 Más vendidos</div>
    ${[...ranking].sort((a,b)=>b.cantidad-a.cantidad).slice(0,5).map((r,i) => `
      <div class="flex items-center justify-between py-1.5 ${i<4?'border-b border-gray-100':''}">

      </div>`).join('')}
  </div>
  <div class="card p-4 mb-4">
    <div class="section-label mb-2">💰 Los que más ganan</div>
    ${[...ranking].sort((a,b)=>b.ganancia-a.ganancia).slice(0,5).map((r,i) => `
      <div class="flex items-center justify-between py-1.5 ${i<4?'border-b border-gray-100':''}">
        <span class="text-gray-700 truncate">${r.emoji} ${r.nombre}</span>
        <span class="font-bold text-green-600 whitespace-nowrap ml-2">${money(r.ganancia)}</span>
      </div>`).join('')}
  </div>` : ''}

  ${ventasPorVendedor.length ? `
  <div class="card p-4 mb-4">
    <div class="section-label mb-2">👤 Ventas por vendedor</div>
    ${ventasPorVendedor.map((vv,i) => `
      <div class="flex items-center justify-between py-1.5 ${i<ventasPorVendedor.length-1?'border-b border-gray-100':''}">

        <span class="font-bold text-gray-900 whitespace-nowrap ml-2">${money(vv.total)}</span>
      </div>`).join('')}

  <div class="card p-4 mb-4">
    <div class="section-label mb-2">🧾 Gastos y ganancia neta</div>
    <div class="flex items-center justify-between py-1.5">
      <span class="text-gray-700">Ganancia bruta</span>

function ventasPeriodoActual(){
  const hoy = new Date();
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getTime();
  return filtroPeriodoReportes === 'mes' ? state.ventas.filter(v => v.fecha >= inicioMes) : state.ventas;
}
function descargarReporteCSV(){
  const ventas = [...ventasPeriodoActual()].sort((a,b)=>a.fecha-b.fecha);
  const filas = [['Fecha','Hora','Metodo de pago','Cantidad de productos','Total','Ganancia']];
  ventas.forEach(v => {
    const d = new Date(v.fecha);
    const cantidad = v.items.reduce((s,i)=>s+i.cantidad,0) + (v.combos||[]).reduce((s,i)=>s+i.cantidad,0);
    filas.push([d.toLocaleDateString('es-AR'), d.toLocaleTimeString('es-AR'), v.metodoPago, cantidad, v.total, v.ganancia]);
  });
  const csv = filas.map(f => f.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ventas-${state.negocio.nombre.replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('CSV descargado', { icon:'⬇️' });
}

function iconoMetodo(m){ return m==='efectivo'?'💵':m==='transferencia'?'📲':'📒'; }

  const venta = state.ventas.find(v=>v.id===id);

function dibujarGraficoReportes(){
  const ctx = document.getElementById('chart-reportes');
  if(!ctx) return;
  const dias = [], totales = [];
  if(filtroPeriodoReportes === 'mes'){
    const hoy = new Date();
    for(let dia=1; dia<=hoy.getDate(); dia++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), dia).getTime();
      const dSig = new Date(hoy.getFullYear(), hoy.getMonth(), dia+1).getTime();
      dias.push(String(dia));
      totales.push(state.ventas.filter(v => v.fecha >= d && v.fecha < dSig).reduce((s,v)=>s+v.ganancia,0));
    }
  } else {
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
      const dSig = d.getTime() + 24*3600*1000;
      dias.push(d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}));
      totales.push(state.ventas.filter(v => v.fecha >= d.getTime() && v.fecha < dSig).reduce((s,v)=>s+v.ganancia,0));
    }
  }
  new Chart(ctx, {
    type: 'line',
    data: { labels: dias, datasets: [{ data: totales, borderColor:'#4338ca', backgroundColor:'rgba(67,56,202,.1)', fill:true, tension:.3, pointRadius:2 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{display:false}, grid:{display:false}}, x:{grid:{display:false}} } }
  });
}

    state.usuarios.push({ id: uid(), nombre, rol, pin });

  guardar();

  toast('Usuario guardado', {icon:'✅'});

        <button onclick="tocarPIN('${usuarioId}',0)" class="tap card py-4 text-2xl font-bold">0</button>
        <button onclick="borrarPIN()" class="tap card py-4 text-xl font-bold">⌫</button>
      </div>
    </div>
  `);
}
function tocarPIN(usuarioId, digito){
  if(pinIngresado.length >= 4) return;
  pinIngresado += digito;
  const el = document.getElementById('pin-puntos');
  if(el) el.textContent = pinIngresado.split('').map(()=>'●').join(' ') + (pinIngresado.length<4 ? ' ' + Array(4-pinIngresado.length).fill('○').join(' ') : '');
  if(pinIngresado.length === 4){
    const u = state.usuarios.find(x=>x.id===usuarioId);
    if(u.pin === pinIngresado){
      state.usuarioActualId = usuarioId;
      guardar();
      cerrarModal();
      renderApp();
      toast(`¡Hola, ${u.nombre}!`, {icon:'👋'});
    } else {
      toast('PIN incorrecto', {icon:'⚠️'});
      pinIngresado = '';
      if(el) el.textContent = '○ ○ ○ ○';
    }
  }
}
function borrarPIN(){
  pinIngresado = pinIngresado.slice(0,-1);
  const el = document.getElementById('pin-puntos');
  if(el) el.textContent = pinIngresado.split('').map(()=>'●').join(' ') + (pinIngresado.length<4 ? ' ' + Array(4-pinIngresado.length).fill('○').join(' ') : '');
}
function cambiarTamanoLetra(v){
  state.tamanoLetra = v;
  guardar();
  aplicarTamanoLetra();
  renderApp();
  toast('Tamaño de letra actualizado', {icon:'🔤'});
}
function descargarBackup(){
  const datos = JSON.stringify(state, null, 2);
  const blob = new Blob([datos], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const nombreArchivo = `backup-${state.negocio.nombre.replace(/[^a-z0-9]/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Copia de seguridad descargada', {icon:'⬇️'});
}
function restaurarBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const datos = JSON.parse(e.target.result);
      if(!datos.negocio){ toast('Ese archivo no parece una copia de seguridad válida', {icon:'⚠️'}); return; }
      confirmarAccion('¿Restaurar esta copia? Se van a reemplazar todos los datos actuales por los del archivo.', () => {
        state = { ...estadoVacio(), ...datos };
        migrarProductos();
        guardar();
        aplicarTamanoLetra();
        ir('#/inicio');
        renderApp();
        toast('Copia restaurada correctamente', {icon:'✅'});
      }, 'Sí, restaurar');
    }catch(err){
      toast('No se pudo leer ese archivo', {icon:'⚠️'});
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function borrarTodo(){
  confirmarAccion('¿Seguro? Se van a borrar TODOS los productos, clientes y ventas. Esto no se puede deshacer.', () => {
    confirmarAccion('Última confirmación: ¿borrar todo de verdad?', () => {
      state = estadoVacio();
      guardar();
      onboardingPaso = 1;
      ir('#/inicio');
      renderApp();
    }, 'Sí, borrar todo');
  }, 'Continuar');
}
</script>
</body>
</html>
