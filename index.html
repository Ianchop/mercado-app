<script type="module">
  // Firebase: cuentas reales (email/contraseña + Google) y datos en la nube.
  // Se importa como módulo ES directo desde el CDN de Google: cero instalación,
  // sigue siendo un solo archivo HTML. Las funciones se cuelgan de "window"
  // para que el resto de la app (que es JS clásico) las pueda usar normal.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithRedirect, getRedirectResult, signInWithPopup, signOut, sendPasswordResetEmail,
    EmailAuthProvider, linkWithCredential
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    initializeFirestore, doc, getDoc, getDocFromCache, setDoc, updateDoc, collection, getDocs, addDoc, onSnapshot, query, where, enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAR3EfaWSJ5vQp2OjjTPa3RKMruLD9EGcs",
    authDomain: "mercado-appp.firebaseapp.com",
    projectId: "mercado-appp",
    storageBucket: "mercado-appp.firebasestorage.app",
    messagingSenderId: "702858318110",
    appId: "1:702858318110:web:5c4af57441ef9b5815f90f"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  // getFirestore() por defecto usa un canal de streaming (WebChannel) que
  // Safari bloquea con "Protección avanzada contra el rastreo" activada,
  // tirando errores 400 en el RPC "Listen" y cortando en silencio hasta los
  // guardados simples. initializeFirestore con long-polling forzado evita
  // ese canal y usa peticiones normales, que Safari no bloquea.
  const fbDb = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true, useFetchStreams: false });
  try { await enableIndexedDbPersistence(fbDb); } catch(e) { /* varias pestañas abiertas u navegador viejo: seguimos solo-online */ }

  window.fbOnCambioAuth = (callback) => onAuthStateChanged(fbAuth, callback);
  window.fbRegistrarse = (email, password) => createUserWithEmailAndPassword(fbAuth, email, password);
  window.fbIniciarSesion = (email, password) => signInWithEmailAndPassword(fbAuth, email, password);
  // Primero probamos con ventana emergente (popup): no sale de la página, así
  // que evita el "ir y volver" por la página intermedia de Firebase que en
  // varios navegadores queda en blanco por los bloqueos de cookies de
  // terceros. Solo si el navegador bloquea el popup (típico en algunos
  // celulares) caemos a signInWithRedirect como respaldo.
  window.fbIniciarSesionGoogle = async () => {
    const provider = new GoogleAuthProvider();
    try{
      await signInWithPopup(fbAuth, provider);
    }catch(err){
      if(err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment'){
        return signInWithRedirect(fbAuth, provider);
      }
      throw err;
    }
  };
  window.fbResetPassword = (email) => sendPasswordResetEmail(fbAuth, email);
  window.fbCerrarSesion = () => signOut(fbAuth);
  window.fbGuardarNegocio = (uid, datos) => setDoc(doc(fbDb, 'negocios', uid), datos);
  window.fbCargarNegocio = async (uid) => {
    const snap = await getDoc(doc(fbDb, 'negocios', uid));
    return snap.exists() ? snap.data() : null;
  };
  // Lectura de emergencia SOLO de la copia local (sin tocar la red): para
  // cuando no hay conexión y el intento normal de arriba se colgó o tardó
  // demasiado. Nunca espera al servidor, así que resuelve al instante.
  window.fbCargarNegocioDeCache = async (uid) => {
    const snap = await getDocFromCache(doc(fbDb, 'negocios', uid));
    return snap.exists() ? snap.data() : null;
  };

  // Suscripción mensual: se guarda separada del negocio para que el admin
  // pueda ver/gestionar el estado de pago de todos sin tocar los datos
  // de venta/stock/clientes de cada comercio (eso queda solo para el dueño).
  window.fbCrearSuscripcion = (uid, datos) => setDoc(doc(fbDb, 'suscripciones', uid), datos);
  window.fbCargarSuscripcion = async (uid) => {
    const snap = await getDoc(doc(fbDb, 'suscripciones', uid));
    return snap.exists() ? snap.data() : null;
  };
  window.fbCargarSuscripcionDeCache = async (uid) => {
    const snap = await getDocFromCache(doc(fbDb, 'suscripciones', uid));
    return snap.exists() ? snap.data() : null;
  };
  window.fbListarSuscripciones = async () => {
    const snap = await getDocs(collection(fbDb, 'suscripciones'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };
  window.fbMarcarPagado = (uid, datos) => updateDoc(doc(fbDb, 'suscripciones', uid), datos);
  window.fbCargarConfigPagos = async () => {
    const snap = await getDoc(doc(fbDb, 'config', 'pagos'));
    return snap.exists() ? snap.data() : { linkMercadoPago: '' };
  };
  window.fbGuardarConfigPagos = (datos) => setDoc(doc(fbDb, 'config', 'pagos'), datos);

  // Catálogo público: un espejo aparte de "negocios/{uid}" con SOLO lo que
  // puede ver cualquiera sin login (nombre, precio, foto, disponibilidad).
  // Nunca el documento completo del negocio, que tiene costos, clientes,
  // fiado, etc. Así las reglas de Firestore pueden permitir lectura pública
  // de esta colección sin exponer nada sensible.
  window.fbGuardarCatalogoPublico = (uid, datos) => setDoc(doc(fbDb, 'catalogosPublicos', uid), datos);
  window.fbCargarCatalogoPublico = async (uid) => {
    const snap = await getDoc(doc(fbDb, 'catalogosPublicos', uid));
    return snap.exists() ? snap.data() : null;
  };
  // Pedidos que manda un cliente desde el catálogo público (sin login): se
  // pueden CREAR sin auth, pero solo el dueño del negocio (auth.uid ==
  // negocioUid del pedido) puede leerlos/actualizarlos — eso lo exige la
  // regla de Firestore, no este archivo.
  window.fbCrearPedidoPublico = (datos) => addDoc(collection(fbDb, 'pedidosPublicos'), datos);
  window.fbEscucharPedidos = (uid, callback) => {
    const q = query(collection(fbDb, 'pedidosPublicos'), where('negocioUid', '==', uid));
    return onSnapshot(q, snap => callback(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
  };
  window.fbActualizarPedido = (pedidoId, datos) => updateDoc(doc(fbDb, 'pedidosPublicos', pedidoId), datos);

  // Cuentas creadas por Google: además del login de Google, exigimos una
  // contraseña propia (linkWithCredential la agrega a la MISMA cuenta, no
  // crea una cuenta nueva). Así el mail siempre tiene los dos métodos y
  // nunca se pisan entre sí.
  window.fbVincularPassword = (password) => {
    const cred = EmailAuthProvider.credential(fbAuth.currentUser.email, password);
    return linkWithCredential(fbAuth.currentUser, cred);
  };
  // Si alguien ya tenía cuenta por mail/contraseña y después toca "Continuar
  // con Google" con ese mismo mail, Firebase no los une solo (por seguridad):
  // hay que confirmar la contraseña existente y recién ahí vincular Google.
  window.fbCredencialGoogleDeError = (err) => GoogleAuthProvider.credentialFromError(err);
  window.fbIniciarSesionYVincularGoogle = async (email, password) => {
    await signInWithEmailAndPassword(fbAuth, email, password);
    const cred = window.__credencialGooglePendiente;
    if(cred){
      await linkWithCredential(fbAuth.currentUser, cred);
      window.__credencialGooglePendiente = null;
    }
  };

  // Al volver de la pantalla de Google, Firebase resuelve esto solo; acá
  // solo capturamos el error si algo salió mal (ej: dominio no autorizado,
  // o el mail ya tenía cuenta con contraseña) para poder avisarle al
  // usuario en vez de fallar en silencio.
  getRedirectResult(fbAuth).catch((err) => {
    window.__errorRedirectGoogle = err;
  });
</script>

  /* ====================== FORMATO PC / PÁGINA WEB ======================

<script>
// Guarda el último error global (aunque venga de un script de otro origen,
// como el de Firebase, con lo que el navegador nos deje ver) para poder
// mostrar una pista real si la sesión se cuelga, en vez de solo "algo falló".
window.__ultimoErrorGlobal = '';
window.addEventListener('error', (e) => {
  window.__ultimoErrorGlobal = (e.message || 'Error desconocido') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
});
window.addEventListener('unhandledrejection', (e) => {
  window.__ultimoErrorGlobal = 'Promesa rechazada: ' + ((e.reason && (e.reason.code || e.reason.message)) || String(e.reason));
});

/* ====================== CUENTAS (Firebase Auth) ====================== */
// Cada negocio = una cuenta real de Firebase (mail o Google), con sus datos
// guardados en la nube (Firestore), separados del resto por su propio uid.
function nombreRubro(tipo){
  return { mercado:'Mercado / Despensa', ropa:'Tienda de ropa', bazar:'Bazar / Regalería', otro:'Otro rubro' }[tipo] || 'Otro rubro';
}
function traducirErrorFirebase(err){
  const codigo = (err && err.code) || '';
  const mapa = {
    'auth/invalid-email': 'Ese mail no es válido',
    'auth/user-not-found': 'No encontramos ninguna cuenta con ese mail',
    'auth/wrong-password': 'La contraseña es incorrecta',
    'auth/invalid-credential': 'Mail o contraseña incorrectos',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese mail',
    'auth/weak-password': 'La contraseña tiene que tener al menos 6 caracteres',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar',
    'auth/network-request-failed': 'Revisá tu conexión a internet',
    'auth/unauthorized-domain': 'Este sitio todavía no está autorizado en Firebase',
    'auth/account-exists-with-different-credential': 'Ese mail ya tiene una cuenta creada con contraseña. Usá "¿Olvidaste tu contraseña?" para entrar.',
  };
  return mapa[codigo] || 'Ocurrió un error, probá de nuevo';
}

/* ====================== ESTADO Y PERSISTENCIA ====================== */
function estadoVacio(){
  return {
    negocio: null, // {nombre, tipo}
    productos: [],
    categorias: [],
    combos: [],
    proveedores: [],
    clientes: [],
    ventas: [],
    fiadoMovimientos: [],
    cierres: [],
    eliminaciones: [],
    gastos: [],
    recepciones: [],          // historial de recepciones de mercadería cerradas
    proveedorMovimientos: [], // cuenta corriente con proveedores: {proveedorId, tipo:'debe'|'pago', monto, fecha, detalle}
    usuarios: [],
    usuarioActualId: '',
    metaDiaria: 0,
    tamanoLetra: 'normal'
  };
}

let state = estadoVacio();
let usuarioFirebase = null; // usuario de Firebase logueado (o null)
let sesionLista = false; // true recién cuando Firebase nos confirmó si hay sesión o no

/* ====================== SUSCRIPCIÓN ($5.000/mes por Mercado Pago) ======================
   Este mail es solo para decidir QUÉ PANTALLA mostrar en el cliente (comodidad de UI).
   La seguridad de verdad está en las reglas de Firestore, que chequean el mismo mail
   del lado del servidor: aunque alguien edite este archivo, no puede leer ni tocar
   la suscripción de otro negocio ni marcarse a sí mismo como pagado. */
const ADMIN_EMAIL = 'psocikian@gmail.com';
function esAdminActual(){ return !!(usuarioFirebase && usuarioFirebase.email === ADMIN_EMAIL); }

let suscripcionActual = null; // suscripción del negocio logueado (dueños)
let listaSuscripciones = [];  // todas las suscripciones (solo panel admin)
let configPagos = { linkMercadoPago: '' };

/* Pedidos entrantes del catálogo público (?tienda=uid), en vivo. Se
   escuchan una sola vez por sesión iniciada (onSnapshot), no por cada visita
   a la pantalla de Pedidos, para poder mostrar el contador de "nuevos" desde
   cualquier parte de la app. */
let pedidosEntrantes = [];
let _detenerEscuchaPedidos = null;
function iniciarEscuchaPedidos(uid){
  if(_detenerEscuchaPedidos) return; // ya está escuchando
  _detenerEscuchaPedidos = window.fbEscucharPedidos(uid, (pedidos) => {
    pedidosEntrantes = pedidos.sort((a,b) => (b.fecha||0)-(a.fecha||0));
    renderApp();
  });
}
function detenerEscuchaPedidos(){
  if(_detenerEscuchaPedidos){ _detenerEscuchaPedidos(); _detenerEscuchaPedidos = null; }
  pedidosEntrantes = [];
}

/* ====================== CONTRASEÑA OBLIGATORIA PARA CUENTAS DE GOOGLE ======================
   Toda cuenta tiene que poder entrar también con mail+contraseña (no solo con
   Google), para no depender de un solo método. Estos dos flags gatean la
   pantalla correspondiente ANTES que cualquier otra cosa (admin, onboarding, etc). */
let pantallaCrearPassword = false; // true: logueado con Google pero sin contraseña propia todavía
let vinculandoGoogleEmail = '';    // no vacío: el mail ya tenía cuenta con contraseña, hay que confirmarla para unir Google
let errorCargaDatos = false;       // true: no se pudieron cargar los datos del negocio (conexión lenta/caída) — no seguir a onboarding para no pisar datos reales
let modoDemoAdmin = false;         // true: el admin está viendo la app normal (su propio negocio de demo) en vez del panel

/* ====================== SIN CONEXIÓN ======================
   Firestore ya guarda una copia local y sube los cambios solo en cuanto
   vuelve la señal (enableIndexedDbPersistence, más arriba). Esto solo
   agrega el aviso visual para que el que atiende sepa que puede seguir
   vendiendo tranquilo aunque se corte el wifi/datos. */
let conexionOnline = navigator.onLine;
window.addEventListener('online', () => { conexionOnline = true; renderApp(); });
window.addEventListener('offline', () => { conexionOnline = false; renderApp(); });
function bannerSinConexion(){
  if(conexionOnline) return '';
  return `<div class="bg-gray-800 text-white text-center text-sm font-bold py-2 px-4 flex items-center justify-center gap-2">
    ${icono('wifi-off','w-4 h-4')} Sin conexión — tus ventas se guardan igual y se suben solas cuando vuelva
  </div>`;
}

function suscripcionValida(s){
  if(!s || !s.proximoVencimiento) return false;
  return s.proximoVencimiento >= new Date().toISOString().slice(0,10);
}
function calcularProximoVencimiento(){
  const d = new Date();
  d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0,10);
}
function estadoSuscripcionInfo(s){
  const hoy = new Date().toISOString().slice(0,10);
  if(!s || !s.proximoVencimiento) return { texto: 'Nunca pagó', bg:'#fef2f2', color:'#dc2626' };
  if(s.proximoVencimiento < hoy) return { texto: `Vencido (${formatearFechaCorta(s.proximoVencimiento)})`, bg:'#fef2f2', color:'#dc2626' };
  return { texto: `Activo hasta ${formatearFechaCorta(s.proximoVencimiento)}`, bg:'#ecfdf5', color:'#059669' };
}

function migrarProductos(){
  state.productos.forEach(p => {
    if(p.marca === undefined) p.marca = '';
    if(p.contenidoCantidad === undefined) p.contenidoCantidad = 1;
    if(p.contenidoUnidad === undefined) p.contenidoUnidad = 'unidades';
    if(p.vencimiento === undefined) p.vencimiento = '';
    if(p.temporada === undefined) p.temporada = '';
    if(p.categoriaId === undefined) p.categoriaId = '';
    if(p.proveedorId === undefined) p.proveedorId = '';
    if(p.codigoBarras === undefined) p.codigoBarras = '';
  });
  if(state.negocio){
    if(state.negocio.telefono === undefined) state.negocio.telefono = '';
    if(state.negocio.catalogoPublico === undefined) state.negocio.catalogoPublico = false;
    if(state.negocio.catalogoIndexable === undefined) state.negocio.catalogoIndexable = false;
    if(state.negocio.logoUrl === undefined) state.negocio.logoUrl = '';
    if(state.negocio.portadaUrl === undefined) state.negocio.portadaUrl = '';
    if(state.negocio.mercadoPagoAccessToken === undefined) state.negocio.mercadoPagoAccessToken = '';
  }
}

let guardarTimeout = null;
function guardar(){
  if(!usuarioFirebase) return;
  clearTimeout(guardarTimeout);
  guardarTimeout = setTimeout(() => {
    window.fbGuardarNegocio(usuarioFirebase.uid, state).catch(() => {
      toast('No se pudo guardar en la nube. Revisá tu conexión.', { icon:'⚠️', duracion:4000 });
    });
    sincronizarCatalogoPublico();
  }, 400);
}

// Espejo público de "negocios/{uid}", solo con lo que puede ver cualquiera
// sin login. Se sube solo cada vez que se guarda algo, mientras el catálogo
// público esté activado — así el catálogo que ve el cliente nunca queda
// desactualizado respecto a precios/stock reales.
function sincronizarCatalogoPublico(){
  if(!usuarioFirebase || !state.negocio || !state.negocio.catalogoPublico) return;
  const datos = {
    nombre: state.negocio.nombre,
    telefono: state.negocio.telefono || '',
    logoUrl: state.negocio.logoUrl || '',
    portadaUrl: state.negocio.portadaUrl || '',
    indexable: !!state.negocio.catalogoIndexable,
    categorias: state.categorias.map(c => ({ id: c.id, nombre: c.nombre, emoji: c.emoji || '' })),
    productos: state.productos.map(p => ({
      id: p.id, nombre: p.nombre, marca: p.marca || '', precio: p.precio,
      emoji: p.emoji || '', imagen: p.imagen || '', categoriaId: p.categoriaId || '',
      disponible: p.stock > 0, contenidoCantidad: p.contenidoCantidad || 1, contenidoUnidad: p.contenidoUnidad || 'unidades'
    }))
  };
  // setDoc tira una excepción sincrónica (no una promesa rechazada) si algún
  // campo quedó en undefined, así que sin este try/catch un solo producto con
  // un campo faltante bastaba para que la sincronización nunca se ejecutara
  // y para que "guardar()" quedara silenciosamente cortado a la mitad.
  try{
    window.fbGuardarCatalogoPublico(usuarioFirebase.uid, datos).catch(() => {});
  }catch(e){
    console.error('No se pudo sincronizar el catálogo público:', e);
  }
}
function urlCatalogoPublico(){
  return `${location.origin}${location.pathname}?tienda=${usuarioFirebase.uid}`;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Con conexión lenta o inestable (muy común en el celular de un comercio de
// barrio), una consulta a Firestore puede quedar esperando sin resolver
// nunca. Sin este límite, la app se queda trabada en "Cargando..." para
// siempre. Con el límite, como mucho falla y deja reintentar.
function conTimeout(promesa, ms = 10000){
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error('tiempo-agotado')), ms))
  ]);
}

function money(n){
  n = Math.round(Number(n)||0);
  return '$' + n.toLocaleString('es-AR');
}

function fechaLarga(d = new Date()){
  return new Intl.DateTimeFormat('es-AR', { weekday:'long', day:'numeric', month:'long' }).format(d);
}
function fechaHora(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
}
function inicioDeHoy(){
  const d = new Date(); d.setHours(0,0,0,0); return d.getTime();
}
function diasParaVencer(fechaISO){
  if(!fechaISO) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(fechaISO + 'T00:00:00');
  return Math.round((venc - hoy) / 86400000);
}
function formatearFechaCorta(fechaISO){
  if(!fechaISO) return '';
  const d = new Date(fechaISO + 'T00:00:00');
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function estadoVencimiento(fechaISO){
  const dias = diasParaVencer(fechaISO);
  if(dias === null) return null;
  if(dias < 0) return { dias, texto: `Vencido hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'}`, color: 'red' };
  if(dias === 0) return { dias, texto: 'Vence hoy', color: 'red' };
  if(dias <= 7) return { dias, texto: `Vence en ${dias} día${dias===1?'':'s'}`, color: 'red' };
  if(dias <= 30) return { dias, texto: `Vence en ${dias} días`, color: 'amber' };
  return { dias, texto: `Vence el ${formatearFechaCorta(fechaISO)}`, color: 'green' };
}
const TEMPORADAS = ['Verano','Otoño','Invierno','Primavera'];
function esRubroRopa(){ return !!(state.negocio && state.negocio.tipo === 'ropa'); }
function temporadaActual(){
  const mes = new Date().getMonth() + 1;
  if([12,1,2].includes(mes)) return 'Verano';
  if([3,4,5].includes(mes)) return 'Otoño';
  if([6,7,8].includes(mes)) return 'Invierno';
  return 'Primavera';
}
function estadoTemporadaProducto(p){
  if(!p.temporada) return null;
  const actual = temporadaActual();
  if(p.temporada === actual) return { texto: 'En temporada', color: 'green' };
  return { texto: `Fuera de temporada (${p.temporada})`, color: 'amber' };
}
function detalleProducto(p){
  const partes = [];
  if(p.marca) partes.push(p.marca);
  if(!(p.contenidoUnidad === 'unidades' && Number(p.contenidoCantidad) === 1)){
    partes.push(`${p.contenidoCantidad} ${p.contenidoUnidad}`);
  }
  return partes.join(' · ');
}
function esCumpleanosHoy(fechaISO){
  if(!fechaISO) return false;
  const hoy = new Date();
  const d = new Date(fechaISO + 'T00:00:00');
  return d.getMonth() === hoy.getMonth() && d.getDate() === hoy.getDate();
}

function mostrarImportarCatalogo(){
  const nombresActuales = new Set(state.productos.map(p => p.nombre.toLowerCase()));
  const nuevos = CATALOGO_PRODUCTOS.filter(p => !nombresActuales.has(p.nombre.toLowerCase()));
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-1">Importar catálogo completo</div>
      <div class="text-gray-500 text-sm mb-4">
        Se van a agregar <b>${nuevos.length} productos</b> comunes de almacén (fideos, lácteos, fiambres, quesos, bebidas, limpieza, higiene y más), organizados por categoría.
        ${nuevos.length < CATALOGO_PRODUCTOS.length ? `<br><br>${CATALOGO_PRODUCTOS.length - nuevos.length} ya los tenés cargados, esos no se duplican.` : ''}
        <br><br>Los precios son estimados: convendría revisarlos y ajustarlos a los tuyos.
      </div>
      <button onclick="confirmarImportarCatalogo()" class="tap w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl text-lg mb-2" ${nuevos.length===0?'disabled':''}>
        ${nuevos.length===0 ? 'Ya tenés todo importado' : `Importar ${nuevos.length} productos`}
      </button>
      <button onclick="cerrarModal()" class="tap w-full text-gray-400 font-semibold py-3">Cancelar</button>
    </div>
  `);
}
function confirmarImportarCatalogo(){
  const nombresActuales = new Set(state.productos.map(p => p.nombre.toLowerCase()));
  const categoriasActuales = new Map(state.categorias.map(c => [c.nombre.toLowerCase(), c.id]));
  const mapaCategoriaId = {};
  CATALOGO_CATEGORIAS.forEach(c => {
    const existente = categoriasActuales.get(c.nombre.toLowerCase());
    if(existente){
      mapaCategoriaId[c.id] = existente;
    } else {
      const nuevaId = uid();
      state.categorias.push({ id: nuevaId, nombre: c.nombre });
      categoriasActuales.set(c.nombre.toLowerCase(), nuevaId);
      mapaCategoriaId[c.id] = nuevaId;
    }
  });
  let agregados = 0;
  CATALOGO_PRODUCTOS.forEach(p => {
    if(nombresActuales.has(p.nombre.toLowerCase())) return;
    state.productos.push({
      id: uid(), nombre: p.nombre, emoji: p.emoji, imagen: p.imagen || '', marca: p.marca,
      contenidoCantidad: p.contenidoCantidad, contenidoUnidad: p.contenidoUnidad,
      categoriaId: mapaCategoriaId[p.categoriaId] || '', proveedorId: '', codigoBarras: p.codigoBarras || '',
      precio: p.precio, costo: p.costo, stock: p.stock, stockMin: p.stockMin,
      vencimiento: '', temporada: ''
    });
    agregados++;
  });
  guardar();
  cerrarModal();
  renderApp();
  toast(`Se importaron ${agregados} productos`, { icon:'✅', duracion:4500 });
}

/* ====================== ÍCONOS ====================== */
// Íconos de línea (Lucide) en vez de emojis, para las pantallas de mayor
// impacto (login, panel admin, suscripción, navegación, dashboard). Se
// insertan como placeholder <i data-lucide="..."> y lucide.createIcons()
// los convierte en SVG real después de cada render.
function icono(nombre, clase){
  return `<i data-lucide="${nombre}" class="${clase || ''}"></i>`;
}
function refrescarIconos(){
  if(window.lucide) lucide.createIcons();
}
// Foto real del producto si la tenemos (del catálogo importado o vinculada
// al escanear), si no el emoji de siempre. Si la foto no carga (sin
// internet, url caída), cae al emoji solo con CSS, sin JS.
function iconoProducto(p, claseImg, claseEmoji){
  if(p && p.imagen){
    return `<span class="relative inline-flex flex-shrink-0">
      <img src="${p.imagen}" class="${claseImg} rounded-lg object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
      <span class="${claseEmoji}" style="display:none;">${p.emoji}</span>
    </span>`;
  }
  return `<span class="${claseEmoji} flex-shrink-0">${p ? p.emoji : ''}</span>`;
}

/* ====================== TOASTS ====================== */
function toast(msg, opts = {}){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  const acciones = opts.acciones || (opts.accion ? [opts.accion] : []);
  el.innerHTML = `<span>${opts.icon || '✅'}</span><span>${msg}</span>` + acciones.map(a => `<button class="ml-2 underline decoration-2" onclick="${a.fn}">${a.texto}</button>`).join('');
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, opts.duracion || 3200);
}

/* ====================== ESCÁNER DE CÓDIGO DE BARRAS ====================== */
let lectorCodigoBarras = null;
function iniciarEscaneo(onDetectado){
  if(typeof ZXing === 'undefined' || !navigator.mediaDevices){
    toast('Tu navegador no puede usar la cámara para escanear. Escribí el código a mano.', { icon:'📷', duracion:4500 });
    return;
  }
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-3">📷 Escaneá el código de barras</div>
      <video id="video-escaner" class="w-full rounded-2xl bg-black" style="aspect-ratio:4/3; object-fit:cover;" muted playsinline></video>
      <div class="text-gray-400 text-center text-sm mt-3">Apuntá la cámara al código de barras del producto</div>
      <button onclick="cerrarModal()" class="tap w-full bg-gray-100 text-gray-700 font-bold py-3 rounded-2xl mt-4">Cancelar</button>
    </div>
  `);
  const reader = new ZXing.BrowserMultiFormatReader();
  lectorCodigoBarras = reader;
  reader.decodeFromVideoDevice(null, 'video-escaner', (resultado) => {
    if(resultado){
      const codigo = resultado.getText();
      detenerEscaneo();
      cerrarModal();
      onDetectado(codigo);
    }
  }).catch(() => {
    toast('No se pudo acceder a la cámara. Revisá los permisos del navegador.', { icon:'📷', duracion:4500 });
    cerrarModal();
  });
}
function detenerEscaneo(){
  if(lectorCodigoBarras){
    try{ lectorCodigoBarras.reset(); }catch(e){}
    lectorCodigoBarras = null;
  }
}

/* Confirmación propia de la app (no usa el confirm() nativo del navegador,
   que en algunos navegadores/celulares o WebViews falla o ni se muestra) */
let _confirmCallback = null;
function confirmarAccion(mensaje, callback, textoConfirmar = 'Sí, eliminar'){
  _confirmCallback = callback;

      <div class="text-4xl mb-3">⚠️</div>

      <button onclick="cerrarModal()" class="tap w-full bg-gray-100 text-gray-700 font-bold py-3.5 rounded-2xl text-lg">Cancelar</button>
    </div>

}
function ejecutarConfirmacion(){
  const cb = _confirmCallback;
  _confirmCallback = null;
  if(cb) cb();
}

/* ====================== ROUTER ====================== */
window.addEventListener('hashchange', renderApp);
window.addEventListener('DOMContentLoaded', () => {
  // Catálogo público (?tienda=uid): página completamente aparte, sin login,
  // que cualquiera puede abrir escaneando el QR del negocio. No toca Firebase
  // Auth ni el estado privado del negocio — solo lee el espejo público.
  const uidTiendaPublica = new URLSearchParams(location.search).get('tienda');
  if(uidTiendaPublica){
    arrancarCatalogoPublico(uidTiendaPublica);
    return;
  }
  aplicarTamanoLetra();
  renderApp(); // pantalla de carga mientras Firebase confirma la sesión
  // Red de seguridad: si por lo que sea Firebase nunca llega a avisarnos si
  // hay sesión o no (bloqueo del navegador, error interno, lo que sea), no
  // nos quedamos en "Cargando..." para siempre. A los 8s forzamos a mostrar
  // igual la pantalla de inicio de sesión.
  const relojSeguridadSesion = setTimeout(() => {
    if(!sesionLista){
      sesionLista = true;
      renderApp();
      const pista = window.__ultimoErrorGlobal ? ` (${window.__ultimoErrorGlobal})` : '';
      toast('Tardó más de lo normal en confirmar la sesión. Si "Continuar con Google" no funciona, probá con mail y contraseña.' + pista, { icon:'⚠️', duracion:9000 });
    }
  }, 8000);
  window.fbOnCambioAuth(async (user) => {
    clearTimeout(relojSeguridadSesion);
    usuarioFirebase = user;
    suscripcionActual = null;
    listaSuscripciones = [];
    pantallaCrearPassword = false;
    errorCargaDatos = false;
    modoDemoAdmin = false;
    // Todo este bloque va blindado: si algo revienta acá adentro que no
    // esperábamos, no queremos que la página quede en blanco para siempre.
    // Mejor mostrar la pantalla de "no pudimos cargar" con el error real.
    try{
    if(user){
      // Si entró con Google y todavía no tiene una contraseña vinculada a la
      // cuenta, lo mandamos a crearla antes de dejarlo pasar a ningún lado.
      const tienePassword = user.providerData.some(p => p.providerId === 'password');
      if(!tienePassword) pantallaCrearPassword = true;
      try{ configPagos = await conTimeout(window.fbCargarConfigPagos()); }catch(e){ configPagos = { linkMercadoPago:'' }; }
      if(user.email === ADMIN_EMAIL){
        try{ listaSuscripciones = await conTimeout(window.fbListarSuscripciones()); }catch(e){ listaSuscripciones = []; }
        // El admin también puede tener su propio negocio de "demo" (sin pagar,
        // exento por ser admin) para mostrarle las funciones a un dueño de local.
        try{
          const datos = await conTimeout(window.fbCargarNegocio(user.uid));
          state = datos ? { ...estadoVacio(), ...datos } : estadoVacio();
          migrarProductos();
        }catch(e){
          state = estadoVacio();
        }
      } else {
        // Estrategia sin conexión: primero se intenta por red (con límite de
        // tiempo). Si eso falla —celular sin señal, wifi caído, lo que sea—
        // se intenta una lectura de emergencia SOLO de la copia local del
        // celular (nunca toca la red, resuelve al instante). Así, si el
        // negocio ya se había abierto antes en este celular, puede seguir
        // vendiendo offline: los cambios quedan guardados localmente y
        // Firestore los sube solo en cuanto vuelve la conexión.
        let datos = null, seLogroLeer = false;
        try{
          datos = await conTimeout(window.fbCargarNegocio(user.uid));
          seLogroLeer = true;
        }catch(e){
          try{ datos = await window.fbCargarNegocioDeCache(user.uid); seLogroLeer = true; }
          catch(e2){ seLogroLeer = false; }
        }
        if(seLogroLeer){
          state = datos ? { ...estadoVacio(), ...datos } : estadoVacio();
          migrarProductos();
          if(state.negocio){
            // Acá hay que distinguir bien dos casos para no arriesgar la cuenta
            // corriente/suscripción real de nadie:
            // 1) Consultamos CON red y Firestore confirmó que el documento no
            //    existe → recién ahí es seguro crear uno nuevo "sin pagar".
            // 2) No hay red y tampoco hay copia local de la suscripción → es
            //    ambiguo (puede que sí exista en el servidor y nunca se cacheó
            //    acá), así que NO se crea nada: queda sin confirmar y bloquea
            //    el acceso (vistaPago) en vez de arriesgarse a pisar datos.
            let confirmadoAusenteConRed = false;
            try{
              suscripcionActual = await conTimeout(window.fbCargarSuscripcion(user.uid));
              if(suscripcionActual === null) confirmadoAusenteConRed = true;
            }catch(e){
              suscripcionActual = await window.fbCargarSuscripcionDeCache(user.uid).catch(() => null);
            }
            if(confirmadoAusenteConRed){
              suscripcionActual = { email: user.email, nombreNegocio: state.negocio.nombre, tipo: state.negocio.tipo, fechaCreacion: Date.now(), proximoVencimiento: '' };
              window.fbCrearSuscripcion(user.uid, suscripcionActual).catch(() => {});
            }
          }
        } else {
          // Ni red ni copia local: mejor mostrar "no pudimos cargar" y dejar
          // reintentar, que arriesgarse a pisar datos reales de un negocio
          // que ya existe pero no pudimos leer.
          errorCargaDatos = true;
        }
      }
    } else {
      state = estadoVacio();
      detenerEscuchaPedidos();
      // Si "Continuar con Google" falló porque ese mail ya tenía cuenta con
      // contraseña, no mostramos solo un error: pedimos esa contraseña acá
      // mismo para unir las dos formas de entrar a la misma cuenta.
      if(window.__errorRedirectGoogle && window.__errorRedirectGoogle.code === 'auth/account-exists-with-different-credential'){
        vinculandoGoogleEmail = (window.__errorRedirectGoogle.customData && window.__errorRedirectGoogle.customData.email) || '';
        window.__credencialGooglePendiente = window.fbCredencialGoogleDeError(window.__errorRedirectGoogle);
      }
    }
    }catch(e){
      window.__ultimoErrorGlobal = 'Error al procesar sesión: ' + ((e && (e.code || e.message)) || e);
      errorCargaDatos = true;
    }
    sesionLista = true;
    aplicarTamanoLetra();
    if(!location.hash || location.hash === '#/' || location.hash === '#'){ location.hash = '#/inicio'; }
    renderApp();
    if(user && state.negocio) iniciarEscuchaPedidos(user.uid);
    if(!user && window.__errorRedirectGoogle && !vinculandoGoogleEmail){
      toast(traducirErrorFirebase(window.__errorRedirectGoogle), { icon:'⚠️', duracion:5000 });
    }
    window.__errorRedirectGoogle = null;
  });
});

/* Evita que scrollear con la rueda/trackpad sobre un campo numérico le cambie el valor
   (comportamiento por defecto de Chrome que hace que precios/stock "cambien solos") */
document.addEventListener('wheel', (e) => {
  if(e.target && e.target.tagName === 'INPUT' && e.target.type === 'number'){
    e.target.blur();
  }
}, { passive: true });

function aplicarTamanoLetra(){
  const tallas = { pequeno: '14px', normal: '16px', grande: '18px', 'muy-grande': '20px' };
  document.documentElement.style.fontSize = tallas[state.tamanoLetra] || '16px';
}

function ir(hash){ location.hash = hash; }

function renderApp(){
  const app = document.getElementById('app');
  // Cada tecleo en un buscador (oninput) dispara renderApp() de nuevo, y eso
  // reemplaza TODO el HTML de la pantalla — incluido el <input> donde se está
  // escribiendo. El navegador lo trata como un campo nuevo: pierde el foco y
  // en el celular se cierra el teclado después de cada letra. Acá guardamos
  // qué campo tenía el foco (y en qué posición del texto) antes de redibujar,
  // y se lo devolvemos después, para que se pueda escribir seguido como en
  // cualquier buscador normal.
  const mostrar = (html) => {
    const activo = document.activeElement;
    const idActivo = (activo && app.contains(activo) && activo.id) ? activo.id : null;
    const selStart = idActivo && 'selectionStart' in activo ? activo.selectionStart : null;
    const selEnd = idActivo && 'selectionEnd' in activo ? activo.selectionEnd : null;
    app.innerHTML = html;
    refrescarIconos();
    if(idActivo){
      const el = document.getElementById(idActivo);
      if(el){
        el.focus();
        if(selStart !== null && el.setSelectionRange){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }
  };
  if(!sesionLista){
    mostrar(vistaCargando());
    return;
  }
  if(vinculandoGoogleEmail){
    mostrar(vistaVincularGoogle());
    return;
  }
  if(!usuarioFirebase){
    mostrar(vistaLogin());
    return;
  }
  if(pantallaCrearPassword){
    mostrar(vistaCrearPassword());
    return;
  }
  if(errorCargaDatos){
    mostrar(vistaErrorCarga());
    return;
  }
  if(esAdminActual() && !modoDemoAdmin){
    mostrar(vistaAdmin());
    return;
  }
  if(!state.negocio){
    mostrar(vistaOnboarding());
    return;
  }
  // El admin no paga: puede entrar a la app con su propio negocio de prueba
  // para mostrarle las funciones a un dueño de local antes de venderle la suscripción.
  if(!esAdminActual() && !suscripcionValida(suscripcionActual)){
    mostrar(vistaPago());
    return;
  }
  const ruta = (location.hash || '#/inicio').replace('#/','');
  const [pantalla] = ruta.split('/');
  let contenido = '';
  switch(pantalla){
    case 'inicio': contenido = vistaInicio(); break;
    case 'caja': contenido = vistaCaja(); break;
    case 'fiado': contenido = vistaFiado(); break;
    case 'stock': contenido = vistaStock(); break;
    case 'vencimientos': contenido = vistaVencimientos(); break;
    case 'cierre': contenido = vistaCierre(); break;
    case 'proveedores': contenido = vistaProveedores(); break;
    case 'recepcion': contenido = vistaRecepcion(); break;
    case 'gastos': contenido = vistaGastos(); break;
    case 'mas': contenido = vistaMas(); break;
    case 'clientes': contenido = vistaClientes(); break;
    case 'reportes': contenido = vistaReportes(); break;
    case 'config': contenido = vistaConfig(); break;
    case 'pedidos': contenido = vistaPedidos(); break;
    default: contenido = vistaInicio();
  }
  mostrar(`
    ${bannerSinConexion()}
    ${esAdminActual() && modoDemoAdmin ? `
    <div class="bg-amber-500 text-white text-center text-sm font-bold py-2 px-4 flex items-center justify-center gap-3">
      <span class="flex items-center gap-1.5">${icono('crown','w-4 h-4')} Modo demo (cuenta admin)</span>
      <button onclick="salirDemoAdmin()" class="underline">Volver al panel admin</button>
    </div>` : ''}
    ${cabecera()}
    <div class="px-4">${contenido}</div>
    ${navInferior(pantalla)}
  `);
  if(pantalla === 'inicio') dibujarGraficoSemana();
  if(pantalla === 'reportes') dibujarGraficoReportes();
  if(pantalla === 'caja') ajustarPosicionCarritoCaja();
}
// El botón verde de "cobrar" tiene que quedar pegado justo arriba de la
// barra de navegación — pero la altura real de esa barra varía según el
// tamaño de letra elegido, el dispositivo, etc. En vez de asumir un
// número de píxeles fijo (que en algunos celulares la dejaba tapada a la
// mitad), se mide la altura real de la barra y se usa esa.
function ajustarPosicionCarritoCaja(){
  const nav = document.getElementById('nav-principal');
  const carrito = document.getElementById('carrito-flotante-caja');
  if(!nav || !carrito) return;
  // En compu (nav convertido en barra lateral de alto completo) no hay
  // barra inferior de la que esquivar — un margen chico alcanza. En
  // celular sí hace falta la altura real de la barra de abajo.
  const esEscritorio = window.matchMedia('(min-width: 900px)').matches;
  carrito.style.bottom = esEscritorio ? '16px' : (nav.offsetHeight + 'px');
}

function intentarRegistrarse(){

    .then(() => toast('Te mandamos un mail para restablecer tu contraseña', {icon:'📧', duracion:5000}))
    .catch(err => toast(traducirErrorFirebase(err), {icon:'⚠️', duracion:4500}));

    📤 Compartir resumen de hoy
  </button>
  `;
}
function compartirResumenDia(){
  const hoy = inicioDeHoy();
  const ventasHoy = state.ventas.filter(v => v.fecha >= hoy);
  const totalHoy = ventasHoy.reduce((s,v)=>s+v.total,0);
  const gananciaHoy = ventasHoy.reduce((s,v)=>s+v.ganancia,0);
  const bajoStock = state.productos.filter(p => p.stock <= p.stockMin).length;
  const msg = `📊 Resumen de hoy - ${state.negocio.nombre}\n\n💰 Vendido: ${money(totalHoy)}\n📈 Ganancia: ${money(gananciaHoy)}\n🧾 Ventas: ${ventasHoy.length}`
    + (bajoStock ? `\n⚠️ ${bajoStock} producto(s) por reponer` : '');
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}
function tarjetaStat(nombreIcono, label, valor, colorFondo, colorTexto, onclick){
  return `
  <button onclick="${onclick}" class="tap card p-4 text-left flex flex-col gap-2">
    <div class="icon-badge" style="background:${colorFondo}; color:${colorTexto};">${icono(nombreIcono,'w-5 h-5')}</div>
    <div>
      <div class="section-label">${label}</div>
      <div class="text-2xl font-extrabold text-gray-900 mt-0.5">${valor}</div>
    </div>
  </button>`;
}
function dibujarGraficoSemana(){
  const ctx = document.getElementById('chart-semana');
  if(!ctx) return;
  const dias = [];
  const totales = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const dSig = d.getTime() + 24*3600*1000;
    dias.push(d.toLocaleDateString('es-AR',{weekday:'short'}));
    const total = state.ventas.filter(v => v.fecha >= d.getTime() && v.fecha < dSig).reduce((s,v)=>s+v.total,0);
    totales.push(total);
  }
  new Chart(ctx, {
    type: 'bar',
    data: { labels: dias, datasets: [{ data: totales, backgroundColor: '#4338ca', borderRadius: 8 }] },
    options: {
      plugins: { legend: { display:false } },
      scales: { y: { beginAtZero:true, ticks:{ display:false }, grid:{ display:false } }, x: { grid:{ display:false } } }
    }
  });
}

  if(navigator.vibrate) navigator.vibrate(15);

  if(el){ el.classList.add('bounce-add'); setTimeout(()=>el.classList.remove('bounce-add'), 280); }

function escanearParaVender(){
  iniciarEscaneo((codigo) => {
    const producto = state.productos.find(p => p.codigoBarras === codigo);
    if(producto){

/* ====================== VINCULAR CÓDIGO DE BARRAS ======================
   No hay ninguna base de códigos de fábrica completa para poder cargarlos
   de antemano en los 893 productos. En cambio, cuando se escanea un código
   que no está cargado, se consulta Open Food Facts (base pública y
   gratuita, sin necesidad de clave) para decir QUÉ PRODUCTO ES de verdad
   (nombre, marca, foto) — y recién con esa info a la vista, se elige a cuál
   producto del catálogo propio corresponde (o se carga como nuevo, ya
   con esos datos precargados). */
function normalizarTexto(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}
let _codigoAVincular = '';
let _callbackVincular = null;
let _infoProductoEscaneado = null;
// Padrón SEPA / Precios Claros (datos.produccion.gob.ar): base OFICIAL del
// gobierno argentino, actualizada a diario por los comercios por ley. Trae
// ~78.000 códigos de barra reales (EAN/UPC, no inventados) de TODOS los
// rubros (no solo comida), con nombre y marca tal cual se vende en
// Argentina. Se sirve como archivo estático junto a la app (sepa-ean.json)
// en vez de por API: es un padrón que se actualiza una vez por publicación
// de la app, no en cada venta, así que no hace falta bajarlo de nuevo cada
// vez ni pagar por consultas. Formato compacto: {ean: [nombre, marca]}.
let _tablaSepaEan = null;
let _cargandoTablaSepa = null;
function cargarTablaSepaEan(){
  if(_tablaSepaEan) return Promise.resolve(_tablaSepaEan);
  if(_cargandoTablaSepa) return _cargandoTablaSepa;
  _cargandoTablaSepa = fetch('sepa-ean.json')
    .then(r => r.ok ? r.json() : {})
    .then(datos => { _tablaSepaEan = datos; return datos; })
    .catch(() => ({}));
  return _cargandoTablaSepa;
}
// El padrón SEPA viene todo en mayúsculas ("SHAMPOO HEAD SHOULDERS 650ML"):
// se capitaliza para que se lea como el resto de la app.
function capitalizarBonito(s){
  return (s || '').toLowerCase().replace(/(^|\s)([a-zñáéíóúü])/g, (m, sep, c) => sep + c.toUpperCase());
}
async function buscarEnBaseDeProductos(dominio, codigo){
  try{
    const resp = await fetch(`https://${dominio}/api/v2/product/${encodeURIComponent(codigo)}.json?fields=product_name,brands,image_front_small_url`);
    if(!resp.ok) return null;
    const data = await resp.json();
    if(data.status !== 1 || !data.product || !data.product.product_name) return null;
    return {
      nombre: data.product.product_name,
      marca: (data.product.brands || '').split(',')[0].trim(),
      imagen: data.product.image_front_small_url || ''
    };
  }catch(e){
    return null; // sin internet, API caída, etc: seguimos con la búsqueda manual nomás
  }
}
async function buscarInfoCodigoBarras(codigo){
  // 1) SEPA primero: es local (instantáneo, sin esperar red), es la fuente
  // más confiable para productos argentinos, y cubre todos los rubros.
  const tablaSepa = await cargarTablaSepaEan();
  const enSepa = tablaSepa[codigo];
  if(enSepa){
    return { nombre: capitalizarBonito(enSepa[0]), marca: enSepa[1] || '', imagen: '' };
  }
  // 2) Si no está en SEPA, probamos Open Food Facts (comida) y su proyecto
  // hermano Open Products Facts (todo lo demás) — bases más chicas para
  // Argentina, pero a veces traen foto del producto, que SEPA no tiene.
  const enComida = await buscarEnBaseDeProductos('world.openfoodfacts.org', codigo);
  if(enComida) return enComida;
  return await buscarEnBaseDeProductos('world.openproductsfacts.org', codigo);
}
async function mostrarVincularCodigoBarras(codigo, callback){
  _codigoAVincular = codigo;
  _callbackVincular = callback;
  _infoProductoEscaneado = null;
  abrirModal(`
    <div class="p-5">
      <div class="text-xl font-extrabold text-gray-900 mb-1">Código escaneado</div>
      <div id="vincular-info-producto" class="mb-4">
        <div class="text-gray-400 text-sm flex items-center gap-2">${icono('loader-circle','w-4 h-4 animate-spin')} Buscando qué producto es (código ${codigo})...</div>
      </div>
      <label class="font-semibold text-gray-600 text-sm">¿A cuál de tus productos corresponde?</label>
      <input id="vincular-busqueda" type="text" placeholder="Buscar en tu catálogo..." oninput="filtrarVincularCodigoBarras()" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg mt-1 mb-3 focus:border-indigo-600 focus:outline-none" />
      <div id="vincular-resultados" class="flex flex-col gap-2 mb-3" style="max-height:30vh; overflow-y:auto;"></div>
      <button onclick="crearProductoDesdeEscaneo()" class="tap w-full bg-white border-2 border-gray-200 text-gray-700 font-bold py-3.5 rounded-2xl mb-2">+ Es un producto nuevo</button>
      <button onclick="cerrarModal()" class="tap w-full text-gray-400 font-semibold py-2">Cancelar</button>
    </div>
  `);
  const elBusq = document.getElementById('vincular-busqueda');
  if(elBusq) elBusq.focus();

  const info = await buscarInfoCodigoBarras(codigo);
  if(_codigoAVincular !== codigo) return; // se escaneó/cerró otra cosa mientras tanto
  _infoProductoEscaneado = info;
  const contenedor = document.getElementById('vincular-info-producto');
  if(!contenedor) return; // el modal ya se cerró
  if(info){
    // Si ya tenés otros productos de esa misma marca, se muestran de una para
    // elegir directo — así no hace falta escribir nada, y sobre todo, no se
    // termina creando un producto duplicado de una marca que ya tenías
    // cargada con otra presentación/variedad.
    const marcaNorm = normalizarTexto(info.marca);
    const productosDeLaMarca = marcaNorm ? state.productos.filter(p => normalizarTexto(p.marca) === marcaNorm) : [];
    contenedor.innerHTML = `
      <div class="card p-3 flex items-center gap-3 mb-3" style="background:#ecfdf5; border:none;">
        ${info.imagen ? `<img src="${info.imagen}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0" />` : `<span class="text-3xl flex-shrink-0">📦</span>`}
        <div class="min-w-0">
          <div class="text-emerald-700 text-xs font-extrabold tracking-wide">ESTE ES EL PRODUCTO</div>
          <div class="font-bold text-gray-800 truncate">${info.nombre}</div>
          ${info.marca ? `<div class="text-gray-500 text-xs truncate">${info.marca}</div>` : ''}
        </div>
      </div>
      ${productosDeLaMarca.length ? `
      <div class="text-gray-600 text-sm font-semibold mb-2">Ya tenés ${productosDeLaMarca.length} producto${productosDeLaMarca.length===1?'':'s'} de ${info.marca} — elegí cuál es (para no duplicar):</div>
      <div class="flex flex-col gap-2 mb-1" style="max-height:26vh; overflow-y:auto;">
        ${productosDeLaMarca.map(p => `
          <button onclick="vincularCodigoBarras('${p.id}')" class="tap card p-3 flex items-center gap-3 text-left border-2 border-indigo-100">
            ${p.imagen ? `<img src="${p.imagen}" class="w-9 h-9 rounded-lg object-cover flex-shrink-0" />` : `<span class="text-2xl flex-shrink-0">${p.emoji}</span>`}
            <span class="min-w-0">
              <span class="font-bold text-gray-800 block truncate">${p.nombre}</span>
              ${p.codigoBarras ? `<span class="text-amber-600 text-xs">Ya tiene otro código — se lo reemplaza</span>` : ''}
            </span>
          </button>
        `).join('')}
      </div>
      <div class="text-gray-400 text-xs mb-2">¿Ninguno de estos? Buscá por nombre abajo.</div>
      ` : ''}
    `;
  } else {
    contenedor.innerHTML = `<div class="text-gray-400 text-sm">No encontramos información pública de este código. Buscá el producto en tu catálogo o cargalo como nuevo.</div>`;
  }
  refrescarIconos();
}
function filtrarVincularCodigoBarras(){
  const texto = (document.getElementById('vincular-busqueda').value || '').trim().toLowerCase();
  const resultados = !texto ? [] : state.productos.filter(p =>
    p.nombre.toLowerCase().includes(texto) || (p.marca||'').toLowerCase().includes(texto)
  ).slice(0, 20);
  document.getElementById('vincular-resultados').innerHTML = resultados.length
    ? resultados.map(p => `
        <button onclick="vincularCodigoBarras('${p.id}')" class="tap card p-3 flex items-center gap-3 text-left">
          ${iconoProducto(p, 'w-9 h-9', 'text-2xl')}
          <span class="min-w-0">
            <span class="font-bold text-gray-800 block truncate">${p.nombre}</span>
            ${p.codigoBarras ? `<span class="text-amber-600 text-xs">Ya tiene otro código cargado — se lo reemplaza por este</span>` : ''}
          </span>
        </button>
      `).join('')
    : (texto ? `<div class="text-gray-400 text-sm text-center py-3">Sin resultados</div>` : '');
  refrescarIconos();
}
function vincularCodigoBarras(productoId){
  const p = state.productos.find(x=>x.id===productoId);
  if(!p) return;
  p.codigoBarras = _codigoAVincular;
  if(!p.imagen && _infoProductoEscaneado && _infoProductoEscaneado.imagen){
    p.imagen = _infoProductoEscaneado.imagen; // de paso, si no tenía foto, aprovechamos la que encontramos
  }
  guardar();
  cerrarModal();
  toast(`Código guardado en ${p.nombre}`, { icon:'✅' });
  const cb = _callbackVincular;
  _callbackVincular = null;
  if(cb) cb(p);
}
function crearProductoDesdeEscaneo(){
  const codigo = _codigoAVincular;
  const info = _infoProductoEscaneado;
  cerrarModal();
  mostrarFormProducto(null, {
    codigoBarras: codigo,
    ...(info ? { nombre: info.nombre, marca: info.marca, imagen: info.imagen || '' } : {})
  });
}

let ultimaVentaId = null;
let facturarProximaVenta = false; // casillero "Facturar esta venta (AFIP)" del checkout
// "precapturado" es solo para el cobro con MercadoPago: como el pago se
// confirma en segundo plano (puede tardar), no hay que esperar a último
// momento a leer el carrito EN VIVO — para entonces el cajero puede haber
// vaciado el carrito o estar cobrándole a otro cliente. Se congelan los
// items al generar el QR y se venden esos, pase lo que pase con el
// carrito mientras tanto. Lo mismo con "facturar": se congela si estaba
// tildado en ese momento, no el estado actual del casillero.
function confirmarVenta(metodo, clienteId = null, precapturado = null){
  const items = precapturado ? precapturado.items : Object.entries(carrito).filter(([,c])=>c>0).map(([id,c])=>({ productoId:id, cantidad:c }));
  const combosVendidos = precapturado ? precapturado.combos : Object.entries(carritoCombos).filter(([,c])=>c>0).map(([id,c])=>({ comboId:id, cantidad:c }));
  if(!items.length && !combosVendidos.length) return;
  const debeFacturar = precapturado ? !!precapturado.facturar : facturarProximaVenta;
  let total = 0, ganancia = 0;
  items.forEach(it => {
    const p = state.productos.find(x=>x.id===it.productoId);
    if(!p) return;
    total += p.precio * it.cantidad;
    ganancia += (p.precio - p.costo) * it.cantidad;
    p.stock = Math.max(0, p.stock - it.cantidad);
  });
  combosVendidos.forEach(cv => {
    const combo = state.combos.find(x=>x.id===cv.comboId);
    if(!combo) return;
    let costoCombo = 0;
    combo.itemIds.forEach(ci => {
      const p = state.productos.find(x=>x.id===ci.productoId);
      if(!p) return;
      costoCombo += p.costo * ci.cantidad;
      p.stock = Math.max(0, p.stock - ci.cantidad * cv.cantidad);
    });
    total += combo.precio * cv.cantidad;
    ganancia += (combo.precio - costoCombo) * cv.cantidad;
  });
  const venta = { id: uid(), fecha: Date.now(), items, combos: combosVendidos, total, ganancia, metodoPago: metodo, clienteId, vendedorId: state.usuarioActualId || '' };
  state.ventas.push(venta);
  if(metodo === 'fiado' && clienteId){
    const cliente = state.clientes.find(c=>c.id===clienteId);
    cliente.fiado = (cliente.fiado||0) + total;
    state.fiadoMovimientos.push({ id: uid(), clienteId, tipo:'debe', monto: total, fecha: Date.now(), detalle: 'Compra fiada', ventaId: venta.id });
  }
  ultimaVentaId = venta.id;
  guardar();
  if(!precapturado){
    carrito = {};
    carritoCombos = {};
    facturarProximaVenta = false;
    cerrarModal();
    ir('#/inicio');
  }
  renderApp();
  toast(`¡Venta registrada! ${money(total)}`, { icon:'✅', acciones:[
    { fn:'deshacerVenta()', texto:'Deshacer' },
    { fn:`imprimirComprobante('${venta.id}')`, texto:'🖨️ Imprimir' }
  ], duracion: 7000 });
  if(debeFacturar) facturarVentaAfip(venta);
}

/* ---- Cobro dinámico con MercadoPago ----
   Sin backend: se llama directo a la API de MercadoPago desde el propio
   navegador del comerciante, con SU access token (guardado en su
   documento privado de Firestore, nunca en el HTML público — cada
   negocio tiene el suyo). La API de MercadoPago acepta llamadas directas
   desde el navegador (CORS abierto), así que no hace falta esconder el
   token detrás de un servidor propio. Como no hay backend tampoco hay
   webhook: en vez de que MercadoPago avise solo, se pregunta cada pocos
   segundos "¿ya se pagó esto?" mientras el QR está en pantalla. */
const MP_API = 'https://api.mercadopago.com';
// Map (no una sola variable) porque puede haber más de un cobro esperando
// pago al mismo tiempo: el cajero cierra la pantalla del QR de un cliente
// lento y empieza a cobrarle a otro por MercadoPago también.
const _pollsMPActivos = new Map(); // idPago -> intervalId
async function cobrarConMercadoPago(total){
  const items = Object.entries(carrito).filter(([,c])=>c>0).map(([id,c])=>({ productoId:id, cantidad:c }));
  const combosVendidos = Object.entries(carritoCombos).filter(([,c])=>c>0).map(([id,c])=>({ comboId:id, cantidad:c }));
  if(!items.length && !combosVendidos.length) return;
  const token = state.negocio.mercadoPagoAccessToken;
  if(!token){ toast('Todavía no cargaste tu Access Token de MercadoPago en Configuración', {icon:'⚠️', duracion:4500}); return; }
  const facturar = facturarProximaVenta; // congelado acá, no en el momento en que se apruebe el pago
  const idPago = uid();
  abrirModal(`
    <div class="p-5 text-center">
      <div class="text-xl font-extrabold text-gray-900 mb-4">Cobro con MercadoPago</div>
      <div id="mp-estado" data-id-pago="${idPago}" class="py-10">
        ${icono('loader-circle','w-8 h-8 animate-spin mx-auto text-gray-300')}
        <div class="text-gray-400 mt-3">Generando el cobro...</div>
      </div>
      <button onclick="cerrarModal()" class="tap w-full text-gray-400 font-semibold py-2 mt-2">Cerrar (el cobro sigue esperando el pago)</button>
    </div>
  `);
  refrescarIconos();
  let pref;
  try{
    const resp = await conTimeout(fetch(`${MP_API}/checkout/preferences`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: [{ title: `Venta ${state.negocio.nombre}`, quantity: 1, unit_price: total, currency_id: 'ARS' }],
        external_reference: idPago
      })
    }), 15000);
    pref = await resp.json();
    if(!resp.ok) throw new Error(pref.message || 'MercadoPago rechazó la solicitud. Revisá que el Access Token sea válido.');
  }catch(e){
    const el = document.getElementById('mp-estado');
    if(el && el.dataset.idPago === idPago){
      el.innerHTML = `<div class="text-red-600 font-bold">No se pudo generar el cobro.</div><div class="text-gray-400 text-sm mt-1">${(e && e.message) || ''}</div>`;
    }
    return;
  }
  mostrarQrPagoMP(idPago, pref.init_point, total);
  iniciarPollingPagoMP(idPago, items, combosVendidos, token, facturar);
}
function mostrarQrPagoMP(idPago, link, total){
  const el = document.getElementById('mp-estado');
  if(!el || el.dataset.idPago !== idPago) return; // se cerró/reemplazó esta pantalla mientras se generaba
  const qr = qrcode(0, 'M');
  qr.addData(link);
  qr.make();
  el.innerHTML = `
    <img src="${qr.createDataURL(6,8)}" style="width:200px;height:200px;" class="mx-auto mb-3 rounded-xl" alt="QR de MercadoPago" />
    <div class="text-gray-800 font-extrabold text-xl mb-1">${money(total)}</div>
    <div class="text-gray-400 text-sm mb-3">Que el cliente escanee con su app de MercadoPago</div>
    <div class="flex items-center justify-center gap-2 text-indigo-700">
      ${icono('loader-circle','w-4 h-4 animate-spin')}
      <span class="text-sm font-semibold">Esperando el pago...</span>
    </div>
  `;
  refrescarIconos();
}
function iniciarPollingPagoMP(idPago, items, combosVendidos, token, facturar){
  const intervalId = setInterval(async () => {
    let data;
    try{
      const resp = await fetch(`${MP_API}/v1/payments/search?external_reference=${encodeURIComponent(idPago)}&sort=date_created&criteria=desc`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if(!resp.ok) return; // sigue intentando en el próximo ciclo
      data = await resp.json();
    }catch(e){ return; }
    const resultados = (data && data.results) || [];
    const aprobado = resultados.find(p => p.status === 'approved');
    const rechazado = resultados.find(p => p.status === 'rejected' || p.status === 'cancelled');
    if(!aprobado && !rechazado) return;
    detenerPollingPagoMP(idPago);
    const el = document.getElementById('mp-estado');
    const pantallaVisible = el && el.dataset.idPago === idPago;
    if(aprobado){
      if(pantallaVisible) cerrarModal();
      confirmarVenta('mercadopago', null, { items, combos: combosVendidos, facturar });
    } else if(pantallaVisible){
      el.innerHTML = `<div class="text-red-600 font-bold">El pago fue rechazado o cancelado.</div>`;
    }
  }, 3000);
  _pollsMPActivos.set(idPago, intervalId);
}
function detenerPollingPagoMP(idPago){
  const intervalId = _pollsMPActivos.get(idPago);
  if(intervalId) clearInterval(intervalId);
  _pollsMPActivos.delete(idPago);
}

/* ---- Facturación electrónica AFIP ----
   A diferencia de MercadoPago, la API de AFIP no se puede llamar directo
   desde el navegador (no tiene CORS habilitado — se probó a mano), así
   que esto sí necesita un servidor intermedio propio (Netlify, no
   Firebase, para no depender de una tarjeta de crédito). El certificado
   y la clave privada del negocio viven en su documento privado de
   Firestore; el servidor los lee de ahí, nunca los ve el navegador del
   cliente que compra. */
// URL completa (no relativa): el sitio de la app y el backend de AFIP
// viven en dominios distintos (la app puede estar en GitHub Pages o
// donde sea; el backend está en Netlify aparte), así que una ruta
// relativa apuntaría al lugar equivocado.
const AFIP_FUNCION_URL = 'https://mercado-app-afip.netlify.app/.netlify/functions/afip-facturar';
async function facturarVentaAfip(venta){
  toast('Generando factura AFIP...', { icon:'🧾', duracion:3000 });
  try{
    const idToken = await usuarioFirebase.getIdToken();
    const resp = await conTimeout(fetch(AFIP_FUNCION_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${idToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ importe: venta.total })
    }), 20000);
    const datos = await resp.json();
    if(!resp.ok) throw new Error(datos.error || 'Error al facturar');
    venta.facturaAfip = datos;
    guardar();
    mostrarFacturaGenerada(datos);
  }catch(e){
    toast('No se pudo facturar: ' + ((e && e.message) || ''), { icon:'⚠️', duracion:6000 });
  }
}
function mostrarFacturaGenerada(datos){
  const qr = qrcode(0, 'M');
  qr.addData(datos.qrUrl);
  qr.make();
  abrirModal(`
    <div class="p-5 text-center">
      <div class="text-xl font-extrabold text-gray-900 mb-1">${datos.homologacion ? '🧪 Factura de prueba' : '🧾 Factura emitida'}</div>
      ${datos.homologacion ? `<div class="text-amber-600 text-sm font-semibold mb-3">Modo prueba (homologación): no es válida fiscalmente</div>` : ''}
      <div class="text-gray-500 text-sm mb-3">${datos.tipoComprobante} ${String(datos.puntoVenta).padStart(4,'0')}-${String(datos.numeroComprobante).padStart(8,'0')}</div>
      <img src="${qr.createDataURL(6,8)}" style="width:180px;height:180px;" class="mx-auto mb-3 rounded-xl" alt="QR AFIP" />
      <div class="text-gray-700 text-sm mb-1">CAE: <span class="font-bold">${datos.cae}</span></div>
      <div class="text-gray-400 text-xs mb-4">Vence: ${datos.caeVencimiento}</div>
      <button onclick="cerrarModal()" class="tap w-full bg-indigo-700 text-white font-bold py-3.5 rounded-2xl">Listo</button>
    </div>
  `);
  refrescarIconos();
}

function revertirVenta(venta){
  venta.items.forEach(it => {
    const p = state.productos.find(x=>x.id===it.productoId);
    if(p) p.stock += it.cantidad;
  });
  (venta.combos||[]).forEach(cv => {
    const combo = state.combos.find(x=>x.id===cv.comboId);
    if(!combo) return;
    combo.itemIds.forEach(ci => {
      const p = state.productos.find(x=>x.id===ci.productoId);
      if(p) p.stock += ci.cantidad * cv.cantidad;
    });
  });
  if(venta.metodoPago === 'fiado' && venta.clienteId){
    const cliente = state.clientes.find(c=>c.id===venta.clienteId);
    if(cliente) cliente.fiado = Math.max(0,(cliente.fiado||0) - venta.total);
    state.fiadoMovimientos = state.fiadoMovimientos.filter(m => m.ventaId !== venta.id);
  }
  state.ventas = state.ventas.filter(v=>v.id!==venta.id);
}
function deshacerVenta(){
  const venta = state.ventas.find(v=>v.id===ultimaVentaId);
  if(!venta) return;
  revertirVenta(venta);
  guardar();
  renderApp();
  toast('Venta deshecha', { icon:'↩️' });
}

/* ---- Reconocimiento de voz real (Web Speech API), gratis, sin claves ---- */
function iniciarVoz(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('btn-voz');
  if(!SR){
    toast('Tu navegador no tiene micrófono disponible. Usá los productos de abajo 👇', { icon:'🎤', duracion:4500 });
    return;
  }
  const rec = new SR();
  rec.lang = 'es-AR';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  if(btn){ btn.classList.add('pulse-mic'); btn.innerHTML = '🎙️ Escuchando...'; }
  rec.onresult = (e) => {
    const texto = e.results[0][0].transcript;
    procesarTextoVoz(texto);
  };
  rec.onerror = () => {
    toast('No te escuché bien, probá de nuevo o tocá un producto', { icon:'🎤' });
  };
  rec.onend = () => {
    if(btn){ btn.classList.remove('pulse-mic'); btn.innerHTML = '🎤 Por voz'; }
  };
  rec.start();
}

const NUMEROS_TEXTO = { un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10 };
function raizPalabra(w){
  return w.endsWith('es') ? w.slice(0,-2) : w.endsWith('s') ? w.slice(0,-1) : w;
}

function procesarTextoVoz(textoOriginal){
  const texto = textoOriginal.toLowerCase();
  const palabras = texto.split(/\s+/).map(w => w.replace(/[.,!?]/g,'')).filter(Boolean);

  const disparos = []; // { cantidad, productos: [ ... ] } — más de 1 producto = ambiguo
  const disparadoEn = new Set();

  palabras.forEach((w, i) => {
    if(disparadoEn.has(i) || w.length < 3) return;
    const raizDicha = raizPalabra(w);
    if(raizDicha.length < 3) return;
    const candidatos = state.productos.filter(p => {
      const primeraPalabra = p.nombre.toLowerCase().split(' ')[0];
      return w === primeraPalabra || raizDicha === raizPalabra(primeraPalabra) || primeraPalabra.startsWith(raizDicha);
    });
    if(!candidatos.length) return;
    disparadoEn.add(i);

    let elegidos = candidatos;
    if(candidatos.length > 1){
      // Superposición (ej: "fideo" matchea decenas de productos con distintas marcas
      // y tipos). Si el comerciante dijo más palabras (marca/variedad, "vendí fideo
      // tallarín marolio"), nos quedamos con el o los candidatos que más palabras
      // dichas tienen en su nombre — no alcanza con que coincida una sola palabra
      // suelta, porque esa misma palabra puede aparecer en varios candidatos a la vez.
      const palabrasExtra = palabras.filter((w2, i2) => i2 !== i && w2.length >= 3);
      if(palabrasExtra.length){
        const puntuados = candidatos.map(p => {
          const restoNombre = p.nombre.toLowerCase().split(' ').slice(1).join(' ');
          const coincidencias = palabrasExtra.filter(w2 => restoNombre.includes(w2)).length;
          return { p, coincidencias };
        });
        const maxCoincidencias = Math.max(...puntuados.map(x => x.coincidencias));
        if(maxCoincidencias > 0){
          elegidos = puntuados.filter(x => x.coincidencias === maxCoincidencias).map(x => x.p);
        }
      }
    }

    let cantidad = 1;
    for(let j = Math.max(0, i-2); j < i; j++){
      const wAnt = palabras[j];
      if(/^\d+$/.test(wAnt)) cantidad = parseInt(wAnt);
      else if(NUMEROS_TEXTO[wAnt]) cantidad = NUMEROS_TEXTO[wAnt];
    }
    disparos.push({ cantidad, productos: elegidos });
  });

  if(!disparos.length){
    toast(`Escuché "${textoOriginal}" pero no reconocí ningún producto. Probá tocando los productos.`, { icon:'🤔', duracion:4500 });
    return;
  }

  // Si con lo dicho alcanza para un solo producto, se agrega directo. Si hay
  // varios (dijo solo "fideo" y hay muchas marcas, o dijo la marca y hay
  // varias presentaciones/unidades de esa marca), se muestran TODAS las
  // opciones para elegir — la lista del selector scrollea si hace falta.
  const claros = disparos.filter(d => d.productos.length === 1);
  const ambiguos = disparos.filter(d => d.productos.length > 1);

  claros.forEach(({productos, cantidad}) => agregarAlCarrito(productos[0].id, cantidad));
  if(claros.length){
    toast(`Agregué: ${claros.map(e=>e.cantidad+' '+e.productos[0].nombre).join(', ')}`, { icon:'🎤', duracion:4000 });
  }
  if(ambiguos.length){
    mostrarDesambiguacionVoz(ambiguos);
  }
}

function limpiarTelefono(t){ return (t||'').replace(/[^0-9]/g,''); }

// Chequeo del límite de fiado: si el cliente no tiene límite cargado
// (limiteFiado 0 o vacío), no se restringe nada — es una función opcional,
// no todos los clientes tienen por qué tenerla. Si se pasaría del límite,
// no se bloquea directamente: se le avisa al dueño con el detalle (cuánto
// debe, cuánto pasaría a deber, cuál es el límite) y él decide si igual
// quiere fiarle — la idea es que el límite ayude a no perder de vista la
// deuda, no que le ate las manos al dueño con un cliente de confianza.
function verificarLimiteFiado(clienteId, montoNuevo, callback){
  const c = state.clientes.find(x=>x.id===clienteId);
  const limite = c ? (c.limiteFiado || 0) : 0;
  if(!c || limite <= 0){ callback(); return; }
  const deudaFutura = (c.fiado||0) + montoNuevo;
  if(deudaFutura > limite){
    confirmarAccion(
      `${c.nombre} debe ${money(c.fiado||0)}. Con este fiado de ${money(montoNuevo)} pasaría a deber ${money(deudaFutura)}, más que su límite de ${money(limite)}. ¿Fiarle igual?`,
      callback, 'Sí, fiar igual'
    );
  } else {
    callback();
  }
}

function guardarNuevoFiado(){
  const monto = parseFloat(document.getElementById('nf-monto').value);
  if(!monto || monto <= 0){ toast('Poné un monto válido', {icon:'✍️'}); return; }
  let clienteId = document.getElementById('nf-cliente').value;
  const nombreNuevo = document.getElementById('nf-nombre-nuevo').value.trim();
  const detalle = document.getElementById('nf-detalle').value.trim() || 'Fiado';
  if(!clienteId && nombreNuevo){
    const c = { id: uid(), nombre: nombreNuevo, telefono:'', limiteFiado:0, fiado:0 };
    state.clientes.push(c);
    clienteId = c.id;
  }
  if(!clienteId){ toast('Elegí o escribí un cliente', {icon:'👤'}); return; }
  verificarLimiteFiado(clienteId, monto, () => aplicarNuevoFiado(clienteId, monto, detalle));
}
function aplicarNuevoFiado(clienteId, monto, detalle){
  const cliente = state.clientes.find(c=>c.id===clienteId);
  cliente.fiado = (cliente.fiado||0) + monto;
  state.fiadoMovimientos.push({ id: uid(), clienteId, tipo:'debe', monto, fecha: Date.now(), detalle });
  guardar();
  cerrarModal();
  renderApp();
  toast(`Anotado: ${cliente.nombre} debe ${money(cliente.fiado)}`, { icon:'📒' });

  abrirModal(`

    </div>
  `);

function confirmarPagoFiado(clienteId){
  const monto = parseFloat(document.getElementById('pf-monto').value);
  if(!monto || monto <= 0){ toast('Poné un monto válido', {icon:'✍️'}); return; }
  const cliente = state.clientes.find(c=>c.id===clienteId);
  cliente.fiado = Math.max(0, (cliente.fiado||0) - monto);

  cerrarModal();

let filtroStock = 'todos';
let busquedaStock = '';
function vistaStock(){
  const texto = busquedaStock.trim().toLowerCase();

  if(filtroStock === 'bajo'){
    productos = productos.filter(p=>p.stock<=p.stockMin);
    productos.sort((a,b)=> (a.stock/Math.max(1,a.stockMin)) - (b.stock/Math.max(1,b.stockMin)));
  }

  const vacio = `<div class="text-center py-16 text-gray-400">${texto ? 'No encontramos ningún producto con ese nombre' : 'Sin productos todavía'}</div>`;
  let listaHTML;
  if(filtroStock === 'bajo' || texto){
    listaHTML = productos.map(tarjetaProductoStock).join('') || vacio;
  } else {
    const grupos = [
      ...state.categorias.map(c => ({ id:c.id, nombre:c.nombre, productos: productos.filter(p=>p.categoriaId===c.id) })),
      { id:'', nombre:'Sin categoría', productos: productos.filter(p=>!p.categoriaId) }
    ].filter(g => g.productos.length);
    const mostrarEncabezados = grupos.length > 1;
    listaHTML = grupos.map(g => `
      ${mostrarEncabezados ? `<div class="section-label mt-5 mb-2">${g.nombre} (${g.productos.length})</div>` : ''}
      ${g.productos.map(tarjetaProductoStock).join('')}
    `).join('') || vacio;
  }

  return `
  <input id="input-busqueda-stock" type="text" value="${busquedaStock}" oninput="busquedaStock=this.value; renderApp();" placeholder="Buscar producto..."
    class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg mt-2 mb-3 focus:border-indigo-600 focus:outline-none" />

  <div class="flex gap-2 mb-3">

    <button onclick="filtroStock='bajo'; renderApp();" class="tap flex-1 py-2.5 rounded-xl font-bold ${filtroStock==='bajo'?'bg-red-600 text-white':'bg-white text-gray-500'}">Por reponer (${state.productos.filter(p=>(!texto || p.nombre.toLowerCase().includes(texto) || (p.marca||'').toLowerCase().includes(texto)) && p.stock<=p.stockMin).length})</button>
  </div>

  <button onclick="mostrarFormProducto()" class="tap w-full bg-indigo-700 text-white font-bold text-lg py-3.5 rounded-2xl mb-2">+ Nuevo producto</button>

    <button onclick="mostrarCombos()" class="tap bg-white text-gray-700 border-2 border-gray-200 font-bold text-lg py-3.5 rounded-2xl">🎁 Combos</button>
  </div>
  <button onclick="mostrarImportarCatalogo()" class="tap w-full bg-white text-indigo-700 border-2 border-dashed border-indigo-200 font-bold text-base py-3 rounded-2xl mb-4 flex items-center justify-center gap-2">${icono('download','w-5 h-5')} Importar catálogo completo (${CATALOGO_PRODUCTOS.length} productos)</button>

  ${listaHTML}

  ${usuarioEsAdmin() && state.productos.length ? `
  <button onclick="eliminarTodoStock()" class="tap w-full text-red-500 font-semibold py-3 mt-6 text-sm">🗑️ Eliminar todo el stock</button>
  ` : ''}
  `;
}
function eliminarTodoStock(){
  const cantidad = state.productos.length;
  confirmarAccion(`¿Seguro? Se van a borrar los ${cantidad} productos de tu stock (y los combos que los usan). Esto no se puede deshacer.`, () => {

      cerrarModal();
      renderApp();
      toast('Se borró todo el stock', { icon:'🗑️' });

function tarjetaProductoStock(p){
  const ratio = p.stock / Math.max(1,p.stockMin);
  const color = ratio <= 1 ? 'bg-red-500' : ratio <= 2 ? 'bg-amber-400' : 'bg-green-500';
  const est = !esRubroRopa() && p.vencimiento ? estadoVencimiento(p.vencimiento) : null;
  const estTemp = esRubroRopa() ? estadoTemporadaProducto(p) : null;
  const colVenc = est && est.color==='red' ? {bg:'#fef2f2', text:'#dc2626'} : {bg:'#fffbeb', text:'#b45309'};
  const colTemp = estTemp && estTemp.color==='green' ? {bg:'#ecfdf5', text:'#059669'} : {bg:'#fffbeb', text:'#b45309'};
  return `
  <div class="card p-4 mb-3">
    <div class="flex items-center justify-between mb-2">
      <button onclick="mostrarFormProducto('${p.id}')" class="text-left flex items-center gap-3 flex-1 min-w-0">
        ${iconoProducto(p, 'w-9 h-9', 'text-2xl')}
        <span class="min-w-0">
          <span class="font-bold text-gray-800 block truncate">${p.nombre}</span>
          ${detalleProducto(p) ? `<span class="text-gray-400 text-sm block truncate">${detalleProducto(p)}</span>` : ''}
        </span>
      </button>
      <span class="text-gray-400 text-sm whitespace-nowrap ml-2">${money(p.precio)}</span>
    </div>
    ${est && est.dias <= 30 ? `<div class="mb-2"><span class="badge-venc" style="background:${colVenc.bg};color:${colVenc.text};">${est.texto}</span></div>` : ''}
    ${estTemp && estTemp.color==='amber' ? `<div class="mb-2"><span class="badge-venc" style="background:${colTemp.bg};color:${colTemp.text};">${estTemp.texto}</span></div>` : ''}
    <div class="w-full h-2 bg-gray-100 rounded-full mb-2 overflow-hidden">
      <div class="h-full ${color}" style="width:${Math.min(100, ratio*50)}%"></div>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-gray-500 font-semibold">Quedan: <span class="text-gray-900">${p.stock}</span></span>
      <div class="flex items-center gap-2">
        <button onclick="ajustarStock('${p.id}',-1)" class="tap w-10 h-10 rounded-full bg-gray-100 font-bold text-xl">−</button>
        <button onclick="ajustarStock('${p.id}',1)" class="tap w-10 h-10 rounded-full bg-gray-100 font-bold text-xl">+</button>
      </div>
    </div>
  </div>`;
}

  const p = state.productos.find(x=>x.id===id);
  p.stock = Math.max(0, p.stock + delta);
  guardar();
  renderApp();

        <input id="cb-nombre" value="${combo?combo.nombre:''}" placeholder="Ej: Combo desayuno" class="col-span-3 border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg" />
      </div>
      <label class="font-semibold text-gray-600 block mb-2">¿Qué productos incluye?</label>
      <div class="flex flex-col gap-2 max-h-60 overflow-y-auto mb-3">
        ${state.productos.map(p => `
          <div class="flex items-center justify-between card p-2.5">
            <span class="text-gray-800 font-semibold flex items-center gap-2 min-w-0">${iconoProducto(p, 'w-7 h-7', 'text-xl')}<span class="truncate">${p.nombre}</span></span>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="ajustarComboItem('${p.id}',-1)" class="tap w-8 h-8 rounded-full bg-gray-100 font-bold">−</button>
              <span id="cb-cant-${p.id}" class="font-bold w-5 text-center">${comboItemsTemp[p.id]||0}</span>
              <button onclick="ajustarComboItem('${p.id}',1)" class="tap w-8 h-8 rounded-full bg-gray-100 font-bold">+</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="text-gray-500 text-sm mb-3" id="cb-resumen">${resumenComboTexto()}</div>
      <label class="font-semibold text-gray-600">Precio de venta del combo</label>
      <input id="cb-precio" type="number" inputmode="decimal" value="${combo?combo.precio:''}" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-lg my-2 mb-4" />
      <button onclick="guardarCombo('${id||''}')" class="tap w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl text-lg mb-2">Guardar combo</button>
      ${combo ? `<button onclick="eliminarCombo('${id}')" class="tap w-full text-red-600 font-bold py-3">Eliminar combo</button>` : ''}
    </div>
  `);
}
function resumenComboTexto(){
  let costo = 0, sueltoPrecio = 0, cantTotal = 0;
  Object.entries(comboItemsTemp).forEach(([pid,c]) => {
    if(c<=0) return;
    const p = state.productos.find(x=>x.id===pid);
    if(!p) return;
    costo += p.costo * c;
    sueltoPrecio += p.precio * c;
    cantTotal += c;
  });
  if(!cantTotal) return 'Elegí al menos un producto para el combo.';
  return `Costo de estos productos: ${money(costo)} · Precio si los vendés sueltos: ${money(sueltoPrecio)}`;
}
function ajustarComboItem(productoId, delta){
  comboItemsTemp[productoId] = Math.max(0, (comboItemsTemp[productoId]||0) + delta);
  const span = document.getElementById('cb-cant-'+productoId);
  if(span) span.textContent = comboItemsTemp[productoId];
  const resumen = document.getElementById('cb-resumen');
  if(resumen) resumen.textContent = resumenComboTexto();
}
function guardarCombo(id){
  const nombre = document.getElementById('cb-nombre').value.trim();
  const emoji = document.getElementById('cb-emoji').value.trim() || '🎁';
  const precio = parseFloat(document.getElementById('cb-precio').value) || 0;
  const itemIds = Object.entries(comboItemsTemp).filter(([,c])=>c>0).map(([productoId,cantidad])=>({productoId,cantidad}));
  if(!nombre){ toast('Escribí el nombre del combo', {icon:'✍️'}); return; }
  if(!itemIds.length){ toast('Elegí al menos un producto', {icon:'📦'}); return; }
  if(id){
    Object.assign(state.combos.find(c=>c.id===id), { nombre, emoji, precio, itemIds });
  } else {
    state.combos.push({ id: uid(), nombre, emoji, precio, itemIds });
  }
  guardar();
  cerrarModal();
  renderApp();
  toast('Combo guardado', {icon:'✅'});
}
function eliminarCombo(id){
  confirmarAccion('¿Eliminar este combo?', () => {
    state.combos = state.combos.filter(c=>c.id!==id);
    guardar();
    cerrarModal();
    renderApp();
  });
}

    </div>`;
  }).join('') : `

    <div class="text-5xl mb-3">⏳</div>
